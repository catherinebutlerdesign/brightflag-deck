<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marketplace Subscriptions</title>
<meta name="description" content="Clickable prototype of the Marketplace Subscriptions module for the Client, Vendor and Operations actors, built on SoftwareOne Design System tokens and components.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<style>
/* ===== SoftwareOne Design System tokens (from Figma: STYLES › Colours / Typography / Shadows / Spacing) ===== */
:root{
  --brand-primary:#3366ff; --brand-danger:#dc182c; --brand-success:#008556; --brand-warning:#a15d26;
  --brand-type:#000000; --brand-white:#ffffff;
  --info-1:#ebf0ff; --info-2:#85a3ff; --info-3:#2447b3; --info-4:#1a3380;
  --danger-1:#fce8ea; --danger-2:#ee8c96; --danger-3:#bb1425; --danger-4:#8f101d;
  --success-1:#e6f9f2; --success-2:#80e1ae; --success-3:#00784d; --success-4:#005838;
  --warning-1:#fdf2e9; --warning-2:#f1b178; --warning-3:#e87d1e; --warning-4:#733f11;
  --gray-1:#f4f6f8; --gray-2:#e0e5e8; --gray-3:#aeb1b9; --gray-4:#6b7180; --gray-5:#434952; --gray-6:#25282d;
  --brand-gradient:linear-gradient(90deg,#000000 0%,#3366ff 50%,#49d7ff 100%);
  --shadow-1:0 1px 3px rgba(107,113,128,.20),0 1px 16px rgba(107,113,128,.10);
  --shadow-2:0 1px 5px rgba(0,0,0,.30),0 4px 10px 3px rgba(0,0,0,.15);
  --shadow-3:0 4px 6px rgba(0,0,0,.30),0 8px 15px 8px rgba(0,0,0,.15);
  --shadow-dropdown:0 1px 16px rgba(51,56,64,.10),0 1px 3px rgba(51,56,64,.20),0 4px 5px rgba(51,56,64,.15);
  --focus:0 0 0 3px #85a3ff;
  --card-radius:16px; --radius:8px; --radius-chip:4px;
  --spacing-1:8px; --spacing-2:16px; --spacing-3:24px; --spacing-4:32px;
  /* Haas Grot Text is the DS face (55 Roman / 65 Medium / 75 Bold). Helvetica Neue is its closest system relative. */
  --font:"Haas Grot Text","Neue Haas Grotesk Text Pro","Neue Haas Grotesk Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--gray-1);color:var(--brand-type);font:400 14px/20px var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.msi{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-feature-settings:'liga';user-select:none;flex:none;overflow:hidden}
:focus-visible{outline:none;box-shadow:var(--focus)}
.tabular{font-variant-numeric:tabular-nums}

/* ===== Prototype controls (not part of the product UI) ===== */
.proto{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--gray-6);color:#fff;padding:6px 24px;min-height:44px;font-size:13px;line-height:18px}
.proto-tag{font:500 11px/16px var(--font);letter-spacing:.08em;text-transform:uppercase;background:#fff;color:var(--gray-6);border-radius:4px;padding:2px 6px}
.proto-label{color:#c5cad3}
.seg{display:inline-flex;gap:2px;background:rgba(255,255,255,.1);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;color:#dfe3e8;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:13px;line-height:18px}
.seg button:hover{background:rgba(255,255,255,.12)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--brand-type);font-weight:500}
.proto-spacer{flex:1}
.proto-btn{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:8px;padding:5px 12px;cursor:pointer;font-size:13px;line-height:18px;display:inline-flex;align-items:center;gap:6px}
.proto-btn:hover{background:rgba(255,255,255,.12)}
.proto-btn.ghost{border-color:transparent;color:#c5cad3}

/* ===== widget.Header ===== */
.hdr{position:relative;background:#fff;height:80px;display:flex;align-items:center;gap:24px;padding:0 24px}
.hdr::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--brand-gradient)}
.brand{display:flex;align-items:center;gap:16px;flex:none}
.brandmark{position:relative;display:inline-block;flex:none}
.brandmark img{display:block}
.module{display:flex;align-items:center;gap:16px;padding:8px 16px;border:0;border-radius:8px;background:#fff;cursor:pointer;font:500 24px/1.2 var(--font);white-space:nowrap}
.module:hover{background:var(--gray-1)}
.module img{width:24px;height:16px;display:block}
.search{flex:1;max-width:700px;margin:0 auto;height:37px;border:1px solid var(--gray-4);border-radius:8px;display:flex;align-items:center;gap:8px;padding:4px 16px;color:var(--gray-4);background:#fff;min-width:160px}
.search:hover{border-color:var(--brand-primary)}
.search:focus-within{border-color:var(--brand-primary);box-shadow:var(--focus)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:400 14px/20px var(--font);color:var(--brand-type)}
.search input::placeholder{color:var(--gray-4)}
.search .clear{border:0;background:none;color:var(--gray-4);cursor:pointer;padding:0;display:inline-flex}
.hdr-right{display:flex;align-items:center;flex:none}
.extra{display:flex;gap:8px;align-items:center}
.icon-btn{position:relative;width:40px;height:40px;border-radius:20px;border:0;background:transparent;color:var(--gray-4);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.icon-btn:hover{background:var(--gray-2)}
.count{position:absolute;top:1px;left:25px;background:var(--danger-3);color:#fff;border-radius:4px;padding:0 3px;font:500 12px/16px var(--font)}
.unread{position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:6px;background:var(--danger-3);border:2px solid #fff}
.acct{display:flex;align-items:center;gap:16px;padding:8px 24px;border-radius:8px;border:0;background:#fff;cursor:pointer;text-align:left;max-width:300px}
.acct:hover{background:var(--gray-1)}
.acct-name{display:block;font:500 14px/20px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:196px}
.acct-role{display:block;font:400 12px/16px var(--font);color:var(--gray-4);white-space:nowrap}

/* ===== Logos, chips, links ===== */
.logo{display:inline-flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.logo img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.chip{display:inline-flex;align-items:center;padding:2px 8px;border-radius:var(--radius-chip);font:400 14px/20px var(--font);white-space:nowrap;flex:none}
.chip-success{background:var(--success-1);color:var(--success-3)}
.chip-info{background:var(--info-1);color:var(--info-3)}
.chip-danger{background:var(--danger-1);color:var(--danger-3)}
.chip-neutral{background:var(--gray-1);color:var(--gray-5)}
.chip-warning{background:var(--warning-1);color:var(--brand-warning)}
.link{color:var(--info-4);text-decoration:none;cursor:pointer;background:none;border:0;padding:0;font:inherit;text-align:left}
.link:hover{text-decoration:underline}
.cell-main>.link,.hl-main>.link{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .cell-main{min-width:0}
.inline-link{color:var(--brand-primary)}
.link-btn{border:0;background:none;color:var(--brand-primary);cursor:pointer;padding:4px 6px;border-radius:6px;font:400 14px/20px var(--font)}
.link-btn:hover:not(:disabled){background:var(--info-1)}
.link-btn:disabled{color:var(--gray-4);cursor:default}
.muted{color:var(--gray-4)}
.sub-text{font:400 12px/16px var(--font);color:var(--gray-4)}

/* ===== base.button ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:8px 16px;border-radius:var(--radius);border:1px solid transparent;font:400 14px/20px var(--font);cursor:pointer;white-space:nowrap;transition:background-color .12s ease,color .12s ease;flex:none}
.btn-primary{background:var(--brand-primary);color:#fff}
.btn-primary:hover{background:var(--info-3)}
.btn-primary.danger{background:var(--brand-danger)}
.btn-primary.danger:hover{background:var(--danger-3)}
.btn-primary.dark{background:var(--gray-6)}
.btn-primary.dark:hover{background:#000}
.btn-secondary{background:var(--info-1);color:var(--brand-primary)}
.btn-secondary:hover{background:var(--brand-primary);color:#fff}
.btn-secondary.danger{background:var(--danger-1);color:var(--brand-danger)}
.btn-secondary.danger:hover{background:var(--brand-danger);color:#fff}
.btn-outline{background:#fff;border-color:var(--brand-primary);color:var(--brand-primary)}
.btn-outline:hover{background:var(--info-1)}
.btn-text{background:transparent;color:var(--brand-primary);padding:8px}
.btn-text:hover{background:var(--gray-2)}
.btn-text.dark{color:var(--gray-6)}
.btn:disabled,.btn:disabled:hover{background:var(--gray-2);color:var(--gray-4);border-color:transparent;cursor:not-allowed}
.btn-text:disabled,.btn-text:disabled:hover{background:transparent}
.btn-chevron{padding:8px 12px}
.btn.is-processing{pointer-events:none}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== Navigation ribbon & tabs (template.Ribbon Nav) ===== */
.ribbon{background:#fff;border-bottom:1px solid var(--gray-2);display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:60px;padding:0 24px}
.navtabs{display:flex;align-items:stretch;gap:16px;overflow-x:auto;scrollbar-width:none;min-width:0}
.navtabs::-webkit-scrollbar{display:none}
.navtab{position:relative;border:0;background:transparent;padding:20px 16px 19px;font:400 16px/20px var(--font);cursor:pointer;border-radius:8px;white-space:nowrap;color:var(--brand-type);flex:none}
.navtab:hover{background:var(--gray-2)}
.navtab[aria-selected="true"]{color:var(--brand-primary);font-weight:500}
.navtab[aria-selected="true"]::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:3px;border-radius:2px;background:var(--brand-primary)}
.ribbon-actions{display:flex;gap:16px;align-items:center;flex:none}

/* Object ribbon (widget.Ribbon Nav Element) */
.obj-ribbon{background:#fff;border-bottom:1px solid var(--gray-2);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;min-height:60px;padding:2px 24px 2px 16px}
.obj-left{display:flex;align-items:center;gap:8px;min-width:0}
.back{color:var(--brand-primary)}
.obj-type{font:400 12px/16px var(--font);color:var(--gray-4);white-space:nowrap}
.obj-title{display:flex;align-items:center;gap:8px;min-width:0}
.obj-title h1{margin:0;font:500 18px/26px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* ===== Page / cards ===== */
.page{padding:24px;display:flex;flex-direction:column;gap:24px;min-width:0}
.card{background:#fff;border-radius:var(--card-radius);box-shadow:var(--shadow-1);padding:24px;min-width:0}
.tabbar{display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fff;border-radius:var(--card-radius);box-shadow:var(--shadow-1);padding:0 24px;min-height:60px}
.tabbar .navtab[aria-selected="true"]::after{bottom:0}
.section-title{margin:0 0 16px;font:500 18px/26px var(--font)}

/* ===== Highlights (Component/Subscriptions) ===== */
.hl-row{display:flex;flex-wrap:nowrap;align-items:flex-start;column-gap:32px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;padding-bottom:14px;margin-bottom:-14px}
.hl{display:flex;flex-direction:column;gap:8px;flex:0 0 auto;max-width:300px}
.hl-label{font:400 14px/20px var(--font);white-space:nowrap}
.hl-value{display:flex;align-items:center;gap:8px;min-width:0}
.hl-text{display:flex;flex-direction:column;min-width:0}
.hl-main{font:500 14px/20px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl-main.regular{font-weight:400}
.hl-main .link{font-weight:500}
.hl-sub{font:400 12px/16px var(--font);color:var(--gray-4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl-row.compact{column-gap:24px}
/* fade the edge that has more to scroll */
.hl-row.more-r{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 48px),transparent)}
.hl-row.more-l{-webkit-mask-image:linear-gradient(to left,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(to left,#000 calc(100% - 48px),transparent)}
.hl-row.more-l.more-r{-webkit-mask-image:linear-gradient(to right,transparent,#000 48px,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(to right,transparent,#000 48px,#000 calc(100% - 48px),transparent)}

/* ===== Table (template.Table — custom grid) ===== */
.furniture{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.furniture-left{display:flex;gap:8px;flex-wrap:wrap}
.furniture-right{display:flex;gap:16px;align-items:center}
.tbtn{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;padding:4px 8px;border-radius:8px;cursor:pointer;font:400 14px/20px var(--font);color:var(--brand-type);white-space:nowrap}
.tbtn:hover{background:var(--gray-2)}
.tbtn.selected,.tbtn[aria-expanded="true"]{background:var(--info-1);color:var(--brand-primary)}
.grid-area{position:relative}
.grid-wrap{overflow-x:auto}
table.grid{width:100%;border-collapse:collapse;table-layout:fixed}
.grid th{padding:0;text-align:left;border-bottom:1px solid var(--brand-type);border-left:.5px solid var(--gray-2);border-right:.5px solid var(--gray-2);background:#fff;font:700 14px/20px var(--font);vertical-align:middle;transition:background-color .12s}
.grid th:hover{background:var(--gray-2)}
.grid th.sorted{background:var(--info-1);color:var(--brand-primary)}
.grid th.static:hover{background:#fff}
.th{display:flex;align-items:center;gap:6px;padding:8px 16px;min-height:36px}
.th-label{flex:1;min-width:0;display:flex;align-items:center;gap:6px;border:0;background:none;padding:0;font:inherit;color:inherit;text-align:inherit;cursor:pointer;white-space:nowrap;overflow:hidden}
.th-label span.t{overflow:hidden;text-overflow:ellipsis}
.num .th-label{justify-content:flex-end}
.th-label[disabled]{cursor:default}
.th-menu{border:0;background:none;width:20px;height:20px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:inherit;padding:0;flex:none}
.th-menu:hover{background:rgba(0,0,0,.06)}
.grid td{padding:8px 16px;border-bottom:1px solid var(--gray-2);height:55px;vertical-align:middle;overflow:hidden}
.grid td.num{text-align:right}
.grid td.top{vertical-align:top;padding-top:10px}
.grid tbody tr{transition:background-color .12s}
.grid tbody tr.clickable{cursor:pointer}
.grid tbody tr:hover{background:var(--gray-1)}
.grid tfoot td{border-bottom:0;border-top:1px solid var(--brand-type);font-weight:700;height:55px;padding:8px 16px;vertical-align:top}
.grid tfoot td.num{text-align:right}
.cell{display:flex;align-items:center;gap:16px;min-width:0}
.cell-text{display:flex;flex-direction:column;min-width:0;flex:1}
.cell-main{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell-sub{font:400 12px/16px var(--font);color:var(--gray-4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skel{height:16px;border-radius:8px;width:min(150px,90%);background:linear-gradient(90deg,var(--gray-2) 0%,#eef1f3 50%,var(--gray-2) 100%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite}
.skel.faint{opacity:.55}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-100% 0}}
.overlay-card{position:absolute;left:50%;top:76px;transform:translateX(-50%);background:#fff;border:1px solid var(--gray-2);border-radius:8px;box-shadow:var(--shadow-1);padding:24px;text-align:center;width:min(566px,calc(100% - 32px));z-index:2}
.overlay-card h3{margin:0 0 8px;font:500 18px/26px var(--font)}
.overlay-card p{margin:0}
.overlay-card .btn{margin-top:16px}
.footnote{margin:16px 0 0;font:400 12px/16px var(--font);color:var(--gray-4)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:16px}
.pager-left,.pager-right{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.pbtn{display:inline-flex;align-items:center;gap:8px;border:0;background:#fff;padding:8px;border-radius:8px;cursor:pointer;color:var(--gray-6)}
.pbtn:hover:not(:disabled){background:var(--gray-2)}
.pbtn:disabled{color:var(--gray-3);cursor:default}
.pager-page{display:flex;align-items:baseline;gap:8px}
.page-input{width:40px;height:37px;border:1px solid var(--gray-4);border-radius:8px;text-align:center;font:400 14px/20px var(--font);padding:0 4px}
.page-input:hover{border-color:var(--brand-primary)}
.page-input:focus{border-color:var(--brand-primary);box-shadow:var(--focus);outline:none}
.rows-btn{display:inline-flex;align-items:center;gap:4px;border:0;background:none;cursor:pointer;padding:6px 8px;border-radius:8px}
.rows-btn:hover{background:var(--gray-2)}
.qty-input{width:72px;height:37px;border:1px solid var(--gray-4);border-radius:8px;text-align:right;padding:0 12px;font:400 14px/20px var(--font);background:#fff}
.qty-input:hover:not(:disabled){border-color:var(--brand-primary)}
.qty-input:focus{border-color:var(--brand-primary);box-shadow:var(--focus);outline:none}
.qty-input:disabled{background:var(--gray-2);border-color:var(--gray-4);color:var(--gray-4)}
.qty-input.error{border-color:var(--brand-danger)}
.pos{color:var(--success-3)}
.neg{color:var(--danger-3)}

/* ===== Dropdown (widget.Dropdown / base.Menu Item) ===== */
.popover{background:#fff;border-radius:8px;box-shadow:var(--shadow-dropdown);padding:8px 0;z-index:300;min-width:160px;max-height:min(440px,70vh);overflow:auto}
.mi{display:flex;align-items:center;gap:8px;width:100%;border:0;background:#fff;padding:6px 16px;text-align:left;cursor:pointer;font:400 14px/20px var(--font);color:var(--brand-type);white-space:nowrap}
.mi:hover:not(:disabled),.mi:focus-visible{background:var(--gray-1);box-shadow:none}
.mi.selected{background:var(--info-1)}
.mi.danger{color:var(--brand-danger)}
.mi:disabled{color:var(--gray-4);cursor:default}
.mi .mi-text{flex:1}
.mi-divider{height:1px;background:var(--gray-2);margin:8px 16px}
.mi-title{padding:8px 16px 4px;font:700 14px/20px var(--font)}
.mi-field{padding:4px 16px 8px}
.cbox{width:16px;height:16px;border:1.5px solid var(--gray-5);border-radius:2px;display:inline-flex;align-items:center;justify-content:center;flex:none;color:#fff}
.cbox.on{background:var(--brand-primary);border-color:var(--brand-primary)}
.acct-mi{display:flex;align-items:center;gap:12px;padding:8px 16px}

/* ===== Forms (base.Input / base.Label / base.Helper text) ===== */
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.label{font:500 14px/20px var(--font)}
.label .opt{color:var(--gray-4);font-weight:400;margin-left:6px}
.input{position:relative;display:flex;align-items:center;min-height:37px;border:1px solid var(--gray-4);border-radius:8px;background:#fff;overflow:hidden}
.input:hover{border-color:var(--brand-primary)}
.input:focus-within{border-color:var(--brand-primary);box-shadow:var(--focus)}
.input input,.input select,.input textarea{flex:1;min-width:0;border:0;outline:0;background:transparent;font:400 14px/20px var(--font);padding:8px 16px;color:var(--brand-type)}
.input input::placeholder,.input textarea::placeholder{color:var(--gray-4)}
.input select{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:40px}
.input .select-icon{position:absolute;right:12px;pointer-events:none;color:var(--gray-5)}
.input textarea{resize:vertical;min-height:88px}
.input.error{border-color:var(--brand-danger)}
.input.error:focus-within{box-shadow:0 0 0 3px var(--danger-2)}
.input.disabled,.input.disabled:hover{background:var(--gray-2);border-color:var(--gray-4)}
.input.disabled input{color:var(--gray-5)}
.input .err-icon{color:var(--brand-danger);margin-right:12px}
.input .suffix{align-self:stretch;border-left:1px solid var(--gray-4);padding:0 16px;display:flex;align-items:center;justify-content:center;min-width:62px;background:transparent}
.helper{display:flex;justify-content:space-between;gap:16px;font:400 12px/16px var(--font);color:var(--gray-4)}
.helper.error{color:var(--danger-3)}
.form-stack{display:flex;flex-direction:column;gap:24px}
.radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--gray-4);display:inline-flex;align-items:center;justify-content:center;flex:none;background:#fff}
.radio.on{border-color:var(--brand-primary)}
.radio.on::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--brand-primary)}

<script>
/* Marketplace Subscriptions — shared data and pricing model.
   Loaded as a classic script before each prototype, so these top-level
   declarations are visible to the desktop (index.html) and mobile (mobile.html) apps. */
'use strict';
/* ---------- Utilities ---------- */
const cx = (...a) => a.filter(Boolean).join(' ');
const r2 = n => Math.round(n * 100) / 100;
const money = n => (n == null || !isFinite(n)) ? '—' : n.toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const signed = n => (n > 0 ? '+' : '') + money(n);
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const pad = n => String(n).padStart(2, '0');

/* ---------- App context ---------- */
const Ctx = createContext(null);
const useApp = () => useContext(Ctx);

/* ---------- DS primitives ---------- */
function Icon({ name, size = 18, wght = 400, fill = 0, className, style }) {
  return html`<span className=${cx('msi', className)} aria-hidden="true" style=${{ fontSize: size, width: size, height: size, fontVariationSettings: `'FILL' ${fill}, 'wght' ${wght}, 'GRAD' 0, 'opsz' ${Math.max(20, Math.min(48, size))}`, ...style }}>${name}</span>`;
}
function BrandMark({ width = 80 }) {
  const h = width * 0.35294;
  return html`<span className="brandmark" style=${{ width, height: h }} role="img" aria-label="SoftwareOne">
    <img src=${ASSET.one} alt="" style=${{ width, height: h }} />
    <img src=${ASSET.software} alt="" style=${{ position: 'absolute', left: width * 0.013625, top: width * 0.132625, width: width * 0.323075, height: width * 0.0643875 }} />
  </span>`;
}
function Logo({ k, size = 32 }) {
  if (k === 'swo') return html`<span className="logo" style=${{ width: size, height: size }}><${BrandMark} width=${size} /></span>`;
  return html`<span className="logo" style=${{ width: size, height: size }}>${k && ASSET[k] ? html`<img src=${ASSET[k]} alt="" />` : null}</span>`;
}
const TONES = {
  success: ['Active', 'Completed', 'Accepted', 'Exported', 'For sale', 'Paid', 'Published', 'Ready', 'Redeemed'],
  info: ['Updating', 'Processing', 'Default', 'Configuring', 'Enquiring', 'Generating', 'Migrate', 'Open', 'Querying', 'Queued', 'Provisioning', 'Preparing', 'Submitted', 'Validating', 'Owner', 'Enabled'],
  danger: ['Terminated', 'Terminating', 'Expired', 'Error', 'Failed', 'Conflict', 'End-of-sale', 'Mismatch', 'Overdue'],
  warning: ['Issued', 'Pending', 'Quoted', 'Review']
};
const toneOf = s => Object.keys(TONES).find(k => TONES[k].includes(s)) || 'neutral';
const Chip = ({ children, tone }) => html`<span className=${'chip chip-' + (tone || toneOf(children))}>${children}</span>`;

function Button({ variant = 'primary', tone, icon, iconRight, processing, children, className, btnRef, ...rest }) {
  return html`<button ref=${btnRef} type="button" className=${cx('btn', 'btn-' + variant, tone, className, processing && 'is-processing')} aria-busy=${processing ? 'true' : undefined} ...${rest}>
    ${processing
      ? html`<span className="spinner" aria-hidden="true"></span><span className="sr">Processing</span>`
      : html`${icon ? html`<${Icon} name=${icon} size=${16} />` : null}${children}${iconRight ? html`<${Icon} name=${iconRight} size=${16} />` : null}`}
  </button>`;
}

/* Popover anchored with fixed positioning so menus escape scrolling table containers */
/* Open popovers and dialogs stack; outside clicks and Escape only affect the top one,
   so a value menu inside the Filters panel, or Select items over the wizard, closes on its own. */
const popStack = [];
const layers = [];
function useLayer(onClose) {
  const id = useRef(Symbol('layer'));
  const cb = useRef(onClose); cb.current = onClose;
  useEffect(() => {
    layers.push(id.current);
    const k = e => { if (e.key === 'Escape' && layers[layers.length - 1] === id.current) cb.current(); };
    document.addEventListener('keydown', k);
    return () => { document.removeEventListener('keydown', k); const i = layers.lastIndexOf(id.current); if (i >= 0) layers.splice(i, 1); };
  }, []);
}
function Popover({ anchorRef, open, onClose, align = 'left', minWidth, children, label, className, noArrowNav, role = 'menu' }) {
  const ref = useRef(null);
  const pid = useRef(Symbol('pop'));
  const [pos, setPos] = useState(null);
  useEffect(() => { if (!open) return; popStack.push(pid.current); return () => { const i = popStack.lastIndexOf(pid.current); if (i >= 0) popStack.splice(i, 1); }; }, [open]);
  useLayoutEffect(() => {
    if (!open || !anchorRef.current) { setPos(null); return; }
    const r = anchorRef.current.getBoundingClientRect();
    const below = window.innerHeight - r.bottom;
    const p = {};
    if (below < 260 && r.top > below) p.bottom = window.innerHeight - r.top + 4; else p.top = r.bottom + 4;
    if (align === 'right') p.right = Math.max(8, document.documentElement.clientWidth - r.right); else p.left = Math.max(8, r.left);
    setPos(p);
  }, [open]);
  useEffect(() => {
    if (!open) return;
    const top = () => popStack[popStack.length - 1] === pid.current;
    const onDown = e => { if (!top()) return; if (ref.current && !ref.current.contains(e.target) && anchorRef.current && !anchorRef.current.contains(e.target)) onClose(); };
    const onKey = e => { if (e.key === 'Escape' && top()) { e.stopPropagation(); onClose(); anchorRef.current && anchorRef.current.focus(); } };
    const onScroll = e => { if (e.target instanceof Element && e.target.closest('.popover')) return; onClose(); };
    document.addEventListener('mousedown', onDown);
    document.addEventListener('keydown', onKey, true);
    window.addEventListener('scroll', onScroll, true);
    window.addEventListener('resize', onClose);
    return () => { document.removeEventListener('mousedown', onDown); document.removeEventListener('keydown', onKey, true); window.removeEventListener('scroll', onScroll, true); window.removeEventListener('resize', onClose); };
  }, [open, onClose]);
  useEffect(() => { if (open && pos && ref.current) { const f = ref.current.querySelector('[data-autofocus]') || ref.current.querySelector('input, button:not(:disabled)'); f && f.focus({ preventScroll: true }); } }, [open, !!pos]);
  if (!open || !pos) return null;
  const onKeyDown = e => {
    if (noArrowNav || (e.key !== 'ArrowDown' && e.key !== 'ArrowUp')) return;
    const list = [...ref.current.querySelectorAll('button:not(:disabled), input')];
    const i = list.indexOf(document.activeElement);
    const n = e.key === 'ArrowDown' ? (i + 1) % list.length : (i - 1 + list.length) % list.length;
    list[n] && list[n].focus(); e.preventDefault();
  };
  return ReactDOM.createPortal(html`<div ref=${ref} className=${cx('popover', className)} role=${role} aria-label=${label} onKeyDown=${onKeyDown} style=${{ position: 'fixed', minWidth, ...pos }}>${children}</div>`, document.body);
}
function Dropdown({ trigger, children, align, minWidth, label, popClass, noArrowNav, role }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  const close = React.useCallback(() => setOpen(false), []);
  return html`<${Fragment}>
    ${trigger({ ref, open, toggle: () => setOpen(o => !o) })}
    <${Popover} anchorRef=${ref} open=${open} onClose=${close} align=${align} minWidth=${minWidth} label=${label} className=${popClass} noArrowNav=${noArrowNav} role=${role}>${typeof children === 'function' ? children(close) : children}<//>
  <//>`;
}
function MenuItem({ children, onClick, disabled, danger, selected, check, icon, trailing }) {
  const isCheck = check !== undefined;
  return html`<button type="button" role=${isCheck ? 'menuitemcheckbox' : 'menuitem'} aria-checked=${isCheck ? String(!!check) : undefined} className=${cx('mi', danger && 'danger', selected && 'selected')} disabled=${disabled} onClick=${onClick}>
    ${isCheck ? html`<span className=${cx('cbox', check && 'on')}>${check ? html`<${Icon} name="check" size=${12} wght=${700} />` : null}</span>` : null}
    ${icon ? html`<${Icon} name=${icon} size=${16} />` : null}
    <span className="mi-text">${children}</span>
    ${trailing || (selected && !isCheck ? html`<${Icon} name="check" size=${16} style=${{ color: 'var(--brand-primary)' }} />` : null)}
  </button>`;
}
const MenuDivider = () => html`<div className="mi-divider" role="separator"></div>`;
const MenuTitle = ({ children }) => html`<div className="mi-title">${children}</div>`;

function Field({ id, label, optional, value, onChange, placeholder, helper, error, suffix, disabled, textarea, maxLength, type = 'text', inputMode, counter, onBlur }) {
  const hid = id + '-help';

function HLRow({ compact, children }) {
  const ref = useRef(null);
  const [edge, setEdge] = useState({ l: false, r: false });
  const update = () => {
    const el = ref.current; if (!el) return;
    const l = el.scrollLeft > 1, r = el.scrollLeft + el.clientWidth < el.scrollWidth - 1;
    setEdge(e => (e.l === l && e.r === r ? e : { l, r }));
  };
  useLayoutEffect(update);
  useEffect(() => {
    const el = ref.current;
    el.addEventListener('scroll', update, { passive: true });
    const ro = new ResizeObserver(update); ro.observe(el);
    return () => { el.removeEventListener('scroll', update); ro.disconnect(); };
  }, []);
  const scrolls = edge.l || edge.r;
  return html`<div ref=${ref} className=${cx('hl-row', compact && 'compact', edge.l && 'more-l', edge.r && 'more-r')} tabIndex=${scrolls ? 0 : undefined}>${children}</div>`;
}

function Modal({ title, onClose, children, footer, width = 500, onSubmit }) {
  const ref = useRef(null);

    const prev = document.activeElement;
    const el = ref.current && ref.current.querySelector('.modal-body input:not(:disabled), .modal-body select, .modal-body textarea, .modal-foot button:not(:disabled)');
    el && el.focus();
    return () => { prev && prev.focus && prev.focus(); };
  }, []);
  useLayer(onClose);
  const inner = html`<div className="modal-head" id="modal-title">${title}</div><div className="modal-body">${children}</div><div className="modal-foot">${footer}</div>`;
  return ReactDOM.createPortal(html`<div className="overlay" onMouseDown=${e => { if (e.target === e.currentTarget) onClose(); }}>

      ${onSubmit ? html`<form noValidate onSubmit=${e => { e.preventDefault(); onSubmit(); }}>${inner}</form>` : inner}
    </div>
  </div>`, document.body);
}

// Unit purchase price, markup, margin and unit SP stay in step; the vendor only edits the purchase price.
function PriceEditor({ it, currency, vendorOnly, title, onSave, close }) {
  const [mode, setMode] = useState(vendorOnly ? 'pp' : 'markup');
  const [f, setF] = useState({ pp: it.unitPP.toFixed(2), markup: String(+it.markup.toFixed(2)), margin: marginOf(it.markup).toFixed(2), sp: unitSP(it).toFixed(2) });
  const num = s => parseFloat(String(s).replace(',', '.'));
  const update = (key, val) => {
    const n = { ...f, [key]: val }; const x = num(val);
    if (isFinite(x)) {
      const pp = key === 'pp' ? x : num(f.pp);
      let mk = num(f.markup);
      if (key === 'markup') mk = x;
      if (key === 'margin' && x < 100) mk = x / (100 - x) * 100;
      if (key === 'sp' && pp > 0) mk = (x / pp - 1) * 100;
      if (key !== 'markup') n.markup = String(+mk.toFixed(2));
      if (key !== 'margin') n.margin = marginOf(mk).toFixed(2);
      if (key !== 'sp') n.sp = (pp * (1 + mk / 100)).toFixed(2);
    }
    setF(n);
  };
  const first = useRef(true);
  useEffect(() => { if (first.current) { first.current = false; return; } const el = document.getElementById('f-' + mode); el && el.focus(); }, [mode]);
  const pp = num(f.pp), mk = num(f.markup), mg = num(f.margin);
  const err = !(pp >= 0) ? ['pp', 'Enter a unit purchase price of 0 or more.'] : !(mk > -100) ? ['markup', 'Markup must be greater than -100%.'] : !(mg < 100) ? ['margin', 'Margin must be less than 100%.'] : null;
  const save = () => { if (err) return; onSave(pp, mk); };
  const card = (key, label, cur, per, inputLabel, suffix) => {
    const on = mode === key;
    return html`<div className=${cx('rcard', on && 'on')} onClick=${() => setMode(key)}>
      <div className="rcard-left">
        <span className=${cx('radio', on && 'on')} role="radio" aria-checked=${on ? 'true' : 'false'} tabIndex="0" aria-label=${label} onKeyDown=${e => (e.key === ' ' || e.key === 'Enter') && (e.preventDefault(), setMode(key))}></span>
        <span>${label}</span><span className="cur">${cur}</span>${per ? html`<span className="per">${per}</span>` : null}
      </div>
      <${Field} id=${'f-' + key} label=${inputLabel} value=${f[key]} onChange=${v => update(key, v)} disabled=${!on} inputMode="decimal" suffix=${suffix} error=${err && err[0] === key ? err[1] : ''} />
    </div>`;
  };
  return html`<${Modal} title=${title} width=${632} onClose=${close} onSubmit=${save} footer=${html`<${Foot} close=${close}><${Button} type="submit" disabled=${!!err}>Save<//><//>`}>
    <div className="price-head"><div className="muted" style=${{ marginBottom: 8 }}>Item</div><div className="t">${it.name}</div><div className="sub-text">${it.id} | ${it.ext}</div></div>

    ${vendorOnly ? null : html`<${Fragment}>
      ${card('markup', 'Markup', `${+it.markup.toFixed(2)} %`, null, 'New markup', '%')}
      ${card('margin', 'Margin', `${marginOf(it.markup).toFixed(2)}%`, null, 'New margin', '%')}

function SplitModal({ sub, close }) {
  const { actor, updateSub, notify } = useApp();
  const sp = splitOf(sub);
  const tot = elcTotal(sub);
  const [mode, setMode] = useState('alloc');
  const [vals, setVals] = useState(() => Object.fromEntries(sp.buyers.map(b => [b.id, String(+b.alloc.toFixed(2))])));
  const [tried, setTried] = useState(false);
  const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : NaN; };
  // In ELC mode the inputs hold licence counts; allocation follows from them, and the other way round.
  const allocOf = id => mode === 'alloc' ? num(vals[id]) : (tot ? num(vals[id]) / tot * 100 : 0);
  const elcOf = id => mode === 'elc' ? num(vals[id]) : Math.round(tot * (num(vals[id]) || 0) / 100);
  const switchMode = m => {
    if (m === mode || (m === 'elc' && !tot)) return;
    setVals(v => Object.fromEntries(sp.buyers.map(b => [b.id, m === 'elc' ? String(Math.round(tot * (num(v[b.id]) || 0) / 100)) : String(+((num(v[b.id]) || 0) / tot * 100).toFixed(2))])));
    setMode(m);
  };
  const bad = sp.buyers.find(b => { const n = num(vals[b.id]); return !(n >= 0) || (mode === 'alloc' ? n > 100 : (n > tot || !Number.isInteger(n))); });
  const sumA = sp.buyers.reduce((n, b) => n + (allocOf(b.id) || 0), 0);
  const sumE = sp.buyers.reduce((n, b) => n + (elcOf(b.id) || 0), 0);
  const off = Math.abs(sumA - 100) > 0.001;
  const err = bad ? (mode === 'alloc' ? `Enter an allocation between 0 and 100 for ${bad.name}.` : `Enter a whole number of licences between 0 and ${tot} for ${bad.name}.`) : off ? 'Total allocation must equal 100%' : '';
  const pp = totals(sub.items, 'PP'), spx = totals(sub.items, 'SP');
  const amt = (t, a) => a > 0 ? money(t * a / 100) : '—';
  const save = () => {
    setTried(true); if (err) return;
    const buyers = sp.buyers.map(b => ({ name: b.name, id: b.id, ext: b.ext, owner: b.owner, alloc: +allocOf(b.id).toFixed(2) }));
    const many = buyers.filter(b => b.alloc > 0).length > 1;
    const d = sub.id.slice(4).replace(/-/g, '');
    const agreement = sp.agreement || (many ? `SBA-${d.slice(4, 8)}-${d.slice(0, 4)}` : '');
    updateSub(sub.id, s => ({ ...s, split: { id: sp.id, agreement, buyers } }), { event: 'Split billing updated', details: buyers.filter(b => b.alloc > 0).map(b => `${b.name} ${b.alloc}%`).join(' · ') });
    notify('Split billing saved'); close();
  };
  const head = (key, label, disabled) => html`<button type="button" className="th-radio" role="radio" aria-checked=${mode === key ? 'true' : 'false'} disabled=${disabled} title=${disabled ? 'Usage subscriptions have no licence count' : undefined} onClick=${() => switchMode(key)}><span className=${cx('radio', mode === key && 'on')}></span>${label}</button>`;
  const input = (b, key) => {
    const on = mode === key;
    const shown = on ? vals[b.id] : key === 'alloc' ? String(+(allocOf(b.id) || 0).toFixed(2)) : String(elcOf(b.id) || 0);
    const rowBad = tried && on && bad && bad.id === b.id;
    return html`<div className=${cx('input', 'sb-input', !on && 'disabled', rowBad && 'error')}><input aria-label=${`${key === 'alloc' ? 'Allocation %' : 'ELC'} for ${b.name}`} inputMode=${key === 'alloc' ? 'decimal' : 'numeric'} disabled=${!on} value=${shown} onChange=${e => setVals(v => ({ ...v, [b.id]: e.target.value.replace(key === 'alloc' ? /[^\d.,]/g : /[^\d]/g, '') }))} /></div>`;
  };
  const ops = actor.key === 'ops';
  return html`<${Modal} title="Edit split billing" width=${ops ? 1300 : 1200} onClose=${close} onSubmit=${save} footer=${html`<${Foot} close=${close}><${Button} type="submit">Save<//><//>`}>
    <div className="sb-head">
      <div className="kv"><span>Split billing subscription ID</span><span className="v">${sp.id}</span></div>
      <div className="kv"><span>Subscription</span><div><button type="button" className="link v">${sub.name}</button><div className="sub-text">${sub.id}</div></div></div>
      <div className="kv"><span>Split billing agreement ID</span><span className="v">${sp.agreement || html`<span className="muted">—</span>`}</span></div>
      <div className="kv"><span>Base currency</span><span className="v">${sub.currency}</span></div>
    </div>
    <p className="sb-intro">Allocation which is set, is applied at the moment of invoice generation. Any changes made will only take effect in the next billing cycle.</p>
    ${tried && err ? html`<div className="inline-alert sb-alert" role="alert"><div>${err}</div></div>` : null}
    <div className="grid-wrap"><table className="grid" style=${{ minWidth: ops ? 1100 : 960 }}>
      <colgroup><col /><col style=${{ width: 176 }} /><col style=${{ width: 176 }} />${ops ? html`<col style=${{ width: 120 }} /><col style=${{ width: 120 }} />` : null}<col style=${{ width: 118 }} /><col style=${{ width: 118 }} /></colgroup>
      <thead><tr>
        <th className="static" scope="col"><div className="th">Buyer</div></th>
        <th className="static" scope="col"><div className="th" role="radiogroup" aria-label="Allocate by">${head('alloc', 'Allocation %')}</div></th>
        <th className="static" scope="col" title="Estimated licence count. It's indicative only; billing uses the allocation %."><div className="th">${head('elc', 'ELC', !tot)}</div></th>
        ${ops ? html`<th className="static num" scope="col"><div className="th" style=${{ justifyContent: 'flex-end' }}>PPxM</div></th><th className="static num" scope="col"><div className="th" style=${{ justifyContent: 'flex-end' }}>PPxY</div></th>` : null}
        <th className="static num" scope="col"><div className="th" style=${{ justifyContent: 'flex-end' }}>SPxM</div></th>
        <th className="static num" scope="col"><div className="th" style=${{ justifyContent: 'flex-end' }}>SPxY</div></th>
      </tr></thead>
      <tbody>${sp.buyers.map(b => { const a = allocOf(b.id) || 0; return html`<tr key=${b.id}>

        <td className="num tabular">${amt(spx.m, a)}</td>
        <td className="num tabular">${amt(spx.y, a)}</td>
      </tr>`; })}</tbody>
      <tfoot><tr>
        <td></td>
        <td className="num"><b className=${cx('tabular', off && 'neg')}>${+sumA.toFixed(2)}%</b></td>
        <td className="num">${tot ? html`<div className="cell-text tabular"><b>${sumE}</b><span className="cell-sub">out of ${tot}</span></div>` : html`<span className="muted">—</span>`}</td>
        ${ops ? html`<td className="num tabular"><b>${money(pp.m * sumA / 100)}</b></td><td className="num tabular"><b>${money(pp.y * sumA / 100)}</b></td>` : null}
        <td className="num tabular"><b>${money(spx.m * sumA / 100)}</b></td>
        <td className="num tabular"><b>${money(spx.y * sumA / 100)}</b></td>
      </tr></tfoot>
    </table></div>
  <//>`;
}

function OrderWizard({ sub, close, mode }) {
  const { actor, updateSub, notify, addOrder, openOrder } = useApp();
  const terminate = mode === 'terminate';
  const basis = actor.key === 'vendor' ? 'PP' : 'SP';
  const committed = sub.terms[1] !== 'No commitment';
  // Subscriptions billed to several buyers get a Split billing step after Items.
  const withSplit = !terminate && splitOn(sub);
  const keys = withSplit ? ['items', 'split', 'details', 'review', 'summary'] : ['items', 'details', 'review', 'summary'];
  const steps = terminate ? ['Items', 'Details', 'Review order', 'Summary'] : withSplit ? ['Items', 'Split billing', 'Details', 'Review order', 'Summary'] : ['Items', 'Details', 'Review', 'Summary'];
  const [step, setStep] = useState(0);
  const key = keys[step];
  const [bill, setBill] = useState(null); // null until chosen, then 'none' or a buyer ID
  const billTo = bill && bill !== 'none' ? splitOf(sub).buyers.find(b => b.id === bill) : null;
  const [qty, setQty] = useState(() => Object.fromEntries(sub.items.map(it => [it.id, String(terminate ? 0 : it.qty)])));
  const [addId, setAddId] = useState(''); const [notes, setNotes] = useState('');
  const [orderId] = useState(() => `ORD-${String(Date.now()).slice(-4)}-${String(Date.now()).slice(-8, -4)}-${sub.id.slice(-4)}`);
  const [saved, setSaved] = useState(false); const [placing, setPlacing] = useState(false); const [reviewTab, setReviewTab] = useState('items');
  const nq = it => { const n = parseInt(qty[it.id], 10); return isFinite(n) ? n : NaN; };
  const delta = it => nq(it) - it.qty;
  const errs = Object.fromEntries(sub.items.map(it => { const n = nq(it); if (!isFinite(n) || n < 0) return [it.id, 'Enter a whole number of 0 or more.']; if (!terminate && committed && n < it.qty) return [it.id, `You can only reduce ${it.name} at renewal (${sub.renewal}).`]; return [it.id, '']; }).filter(([, e]) => e));
  const changed = sub.items.filter(it => delta(it) !== 0);
  const canNext = key === 'split' ? !!bill : (key !== 'items' || terminate || (changed.length > 0 && !Object.keys(errs).length));
  const unitLabel = basis === 'PP' ? 'Unit purchase price' : 'Unit SP';
  const deltaTotals = { m: changed.reduce((n, it) => n + perYear(it, basis, delta(it)) / 12, 0), y: changed.reduce((n, it) => n + perYear(it, basis, delta(it)), 0) };
  const place = () => {
    setPlacing(true);
    setTimeout(() => {
      const qmap = Object.fromEntries(sub.items.map(it => [it.id, nq(it)]));
      addOrder(newOrderFromSub(sub, { id: orderId, type: terminate ? 'Terminate' : 'Change', qty: qmap, po: addId.trim(), notes: notes.trim(), billTo, actor }));
      updateSub(sub.id, s => ({ ...s, status: terminate ? 'Terminating' : 'Updating', autoRenew: terminate ? false : s.autoRenew, agreement: { ...s.agreement, status: 'Updating' }, pending: terminate ? { type: 'terminate', orderId } : { type: 'change', qty: qmap, orderId } }),
        { event: terminate ? 'Termination requested' : 'Change order placed', details: terminate ? orderId : `${orderId} · ${changed.map(it => `${it.name}: ${it.qty} → ${nq(it)}`).join('; ')}` });
      setPlacing(false); setStep(keys.indexOf('summary'));
      notify(`Order ${orderId} placed`);
    }, 900);
  };

    { key: 'n', title: terminate ? 'ID' : '#', width: 56, sortable: false, render: it => sub.items.indexOf(it) + 1 },

    { key: 'unit', title: unitLabel, align: 'right', width: basis === 'PP' ? 165 : 130, sortable: false, render: it => html`<div className="cell-text tabular"><span>${money(unitOf(it, basis))}</span><span className="cell-sub">${it.period}</span></div>` },

  if (key === 'split') {

    <${LegalText} sub=${sub} />
  <//>`;
  if (key === 'summary') body = html`<${Fragment}>
    <h2>Summary</h2>
    <${OrderStrip} sub=${sub} order=${orderId} orderStatus="Processing" orderType=${typeLabel} agreementStatus="Updating" subStatus=${terminate ? 'Terminating' : 'Updating'} />
    <${SummaryPanel} sub=${sub} terminate=${terminate} />
  <//>`;
  const footer = key === 'summary'
    ? html`<${Button} variant="text" onClick=${close}>Close<//><${Button} onClick=${() => { close(); openOrder(orderId); }}>View order<//>`
    : html`<${Button} variant="text" onClick=${close}>Close<//><div className="foot-actions">
        <${Button} variant="secondary" disabled=${key === 'items' || placing} onClick=${() => setStep(s => s - 1)}>Back<//>
        ${key === 'review' ? html`<${Button} processing=${placing} onClick=${place}>Place order<//>` : html`<${Button} disabled=${!canNext} onClick=${() => setStep(s => s + 1)}>Next<//>`}
      </div>`;
  return html`<${WizardShell} title=${title} steps=${steps} step=${step} footer=${footer} onClose=${close}>${body}<//>`;
}

const fromISO = v => { const [y, m, d] = v.split('-').map(Number); return `${pad(d)} ${MONTHS[m - 1]} ${y}`; };

function SelectItemsModal({ sub, taken, onAdd, close }) {
  const [picked, setPicked] = useState([]);
  const [warn, setWarn] = useState(null);
  const [conds, setConds] = useState(null);
  const isTaken = ci => taken.includes(ci.name);
  const ok = ci => sameModel(ci, sub) && !isTaken(ci);
  const toggle = ci => {
    if (isTaken(ci)) return;
    if (!sameModel(ci, sub)) { setWarn(ci); return; }
    setWarn(null);
    setPicked(p => p.includes(ci.id) ? p.filter(x => x !== ci.id) : [...p, ci.id]);
  };
  const columns = [
    { key: 'sel', title: 'Select', sortable: false, locked: true, width: 52,
      header: ctx => {
        const el = ctx.shown.filter(ok); const n = el.filter(ci => picked.includes(ci.id)).length;
        const state = el.length && n === el.length ? 'on' : n ? 'mixed' : 'none';
        return html`<span className="th-label"><${Check} state=${state} off=${!el.length} label="Select every item on this page that can be added" onClick=${() => { if (!el.length) return; setPicked(p => state === 'on' ? p.filter(id => !el.some(ci => ci.id === id)) : [...new Set([...p, ...el.map(ci => ci.id)])]); }} /></span>`;
      },
      render: ci => html`<${Check} state=${isTaken(ci) || picked.includes(ci.id) ? 'on' : 'none'} off=${!ok(ci)} label=${isTaken(ci) ? `${ci.name} is already in this subscription` : sameModel(ci, sub) ? `Select ${ci.name}` : `${ci.name} has a different billing model or terms`} onClick=${e => { e.stopPropagation(); toggle(ci); }} />` },
    { key: 'name', title: 'Item', locked: true, width: 470, render: ci => html`<${EntityCell} name=${ci.name} sub=${`${ci.id} | ${ci.code} | ${ci.sku}${isTaken(ci) ? ' · Already in this subscription' : ''}`} onClick=${() => toggle(ci)} />` },

const VENDOR_STEPS = ['General', 'Parameters', 'Items', 'Periods', 'Template'];
const TEMPLATES = [
  ['details', 'Subscription details', 'Status, renewal date and available licences, with a pointer to the SoftwareOne account team.'],
  ['confirmed', 'Order confirmation', 'The confirmation sent when the order completed, with where to assign licences.'],
  ['renewal', 'Renewal reminder', 'Reminds the client what renews automatically and when.']
];
function VendorEditWizard({ sub, close }) {
  const { updateSub, notify } = useApp();
  const [step, setStep] = useState(0);
  const [name, setName] = useState(sub.name);
  const [vid, setVid] = useState(sub.ids.vendor);
  const [params, setParams] = useState(Object.fromEntries(sub.params.map(p => [p.id, p.value])));
  const [rows, setRows] = useState(() => sub.items.map(it => ({ key: it.id, src: 'existing', item: it, qty: String(it.qty), removed: false })));
  const [renew, setRenew] = useState(toISO(sub.renewal));
  const [auto, setAuto] = useState(sub.autoRenew);
  const [tpl, setTpl] = useState(sub.template || 'details');
  const [picker, setPicker] = useState(false);
  const usage = it => it.period === 'month';
  const qtyOf = r => parseInt(r.qty, 10);
  const live = rows.filter(r => !r.removed);
  const errors = [
    !name.trim() && [0, 'Enter a subscription name.'],
    !live.length && [2, 'A subscription needs at least one item. Undo a removal or add an item.'],
    ...live.filter(r => !usage(r.item) && !(qtyOf(r) >= 1)).map(r => [2, `Enter a quantity of 1 or more for ${r.item.name}.`]),
    !renew && [3, 'Choose a renewal date.']
  ].filter(Boolean);
  const addItems = cis => setRows(rs => [...rs, ...cis.map(ci => ({ key: 'new-' + ci.id, src: 'new', item: ci, qty: '1', removed: false }))]);
  const save = () => {
    if (errors.length) { setStep(errors[0][0]); return; }
    const stamp = String(Date.now());
    const added = rows.filter(r => r.src === 'new');
    const removed = rows.filter(r => r.src === 'existing' && r.removed);
    const qtyChanged = live.filter(r => r.src === 'existing' && !usage(r.item) && qtyOf(r) !== r.item.qty);
    const items = live.map((r, i) => r.src === 'existing'
      ? { ...r.item, qty: usage(r.item) ? r.item.qty : qtyOf(r) }
      : { name: r.item.name, id: `ITM-${stamp.slice(-4)}-${pad(i)}${stamp.slice(-6, -4)}-${r.item.sku.slice(-4)}`, ext: r.item.code, qty: usage(r.item) ? 1 : qtyOf(r), unitPP: r.item.unitPP, markup: sub.defaultMarkup, period: r.item.period });
    const parts = [
      added.length && `Added ${added.map(r => r.item.name).join(', ')}`,
      removed.length && `Removed ${removed.map(r => r.item.name).join(', ')}`,
      qtyChanged.length && `Quantity changed on ${qtyChanged.map(r => `${r.item.name} (${r.item.qty} → ${qtyOf(r)})`).join(', ')}`,
      name.trim() !== sub.name && `Renamed to “${name.trim()}”`,
      fromISO(renew) !== sub.renewal && `Renewal date ${sub.renewal} → ${fromISO(renew)}`,
      auto !== sub.autoRenew && `Auto renewal ${auto ? 'enabled' : 'disabled'}`,

    case 'o-validate': return html`<${ValidateModal} ...${p} />`;
    case 'o-template': return html`<${TemplateModal} ...${p} />`;
    case 'o-params': return html`<${ParamsEditModal} ...${p} list=${modal.list} />`;
    case 'o-notes': return html`<${NotesModal} ...${p} />`;
    case 'o-attach': return html`<${AttachmentModal} ...${p} attId=${modal.attId} />`;
    case 'o-attach-delete': return html`<${DeleteAttachmentModal} ...${p} attId=${modal.attId} />`;
    case 'o-ids': return html`<${OrderIdModal} ...${p} />`;
    case 'o-edit-order': return html`<${OrderYieldModal} ...${p} />`;
    case 'o-price': return html`<${OrderPriceModal} ...${p} line=${modal.line} />`;
    default: return null;
  }
}

function ModalHost({ modal, subs, close }) {
  if (!modal) return null;
  const sub = subs.find(s => s.id === modal.subId);
  if (!sub) return null;
  const p = { sub, close };
  switch (modal.type) {
    case 'rename': return html`<${RenameModal} ...${p} />`;
    case 'ids': return html`<${IdsModal} ...${p} />`;
    case 'currency': return html`<${CurrencyModal} ...${p} />`;
    case 'terminate': return html`<${TerminateConfirm} ...${p} />`;
    case 'price': return html`<${PriceModal} ...${p} itemId=${modal.itemId} />`;
    case 'yield': return html`<${YieldModal} ...${p} />`;
    case 'params': return html`<${ParamsModal} ...${p} />`;
    case 'split': return html`<${SplitModal} ...${p} />`;
    case 'terminateWizard': return html`<${OrderWizard} ...${p} mode="terminate" />`;
    case 'editWizard': return html`<${OrderWizard} ...${p} mode="change" />`;
    case 'vendorEdit': return html`<${VendorEditWizard} ...${p} />`;
    default: return null;
  }
}
function Toasts({ toasts, dismiss }) {
  return html`<div className="toasts" role="status" aria-live="polite">${toasts.map(t => html`<div className="toast" key=${t.id}>
    <${Icon} name=${t.tone === 'info' ? 'info' : t.tone === 'error' ? 'error' : 'check_circle'} size=${20} fill=${1} className=${t.tone === 'info' ? 'info' : t.tone === 'error' ? 'err' : 'ok'} />
    <span className="msg">${t.text}</span>
    <button type="button" className="icon-btn" style=${{ width: 32, height: 32 }} aria-label="Dismiss" onClick=${() => dismiss(t.id)}><${Icon} name="close" size=${18} /></button>
  </div>`)}</div>`;
}

/* ---------- App ---------- */
function App() {
  const hash = (location.hash || '').replace('#', '');
  const [actorKey, setActorKey] = useState(() => ACTORS[hash] ? hash : (ACTORS[store.get('subs-proto-actor')] ? store.get('subs-proto-actor') : 'client'));
  const [subs, setSubs] = useState(makeSeed);
  const [orders, setOrders] = useState(() => makeOrders(makeSeed()));
  const [route, setRoute] = useState({ module: 'subscriptions', view: 'list' });
  const [query, setQuery] = useState('');
  const [modal, setModal] = useState(null);
  const [toasts, setToasts] = useState([]);
  const actor = ACTORS[actorKey];
  useEffect(() => { store.set('subs-proto-actor', actorKey); }, [actorKey]);
  useEffect(() => { window.scrollTo(0, 0); }, [route.module, route.view, route.id]);
  const curSub = route.module === 'subscriptions' && route.view === 'detail' ? subs.find(s => s.id === route.id) : null;
  const curOrder = route.module === 'orders' && route.view === 'detail' ? orders.find(o => o.id === route.id) : null;

  const notify = (text, tone = 'success') => { const id = Date.now() + Math.random(); setToasts(t => [...t.slice(-2), { id, text, tone }]); setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 4500); };
  const stampAudit = a => { const st = nowStamp(); return { ...a, by: actor.user, byId: actor.userId, date: st.date, time: st.time }; };
  const updateSub = (id, fn, audit) => setSubs(list => list.map(s => { if (s.id !== id) return s; const next = fn(s); return audit ? { ...next, audit: [stampAudit(audit), ...next.audit] } : next; }));
  const updateOrder = (id, fn, audit) => setOrders(list => list.map(o => { if (o.id !== id) return o; const next = fn(o); return audit ? { ...next, audit: [stampAudit(audit), ...next.audit] } : next; }));
  const addOrder = o => setOrders(list => [o, ...list]);
  const openModal = (type, subId, extra) => setModal({ type, subId, ...(extra || {}) });
  const openOrderModal = (type, orderId, extra) => setModal({ type, orderId, ...(extra || {}) });
  const open = id => setRoute({ module: 'subscriptions', view: 'detail', id, tab: null });
  // Opening an order from a subscription remembers it, so Back returns there.
  const openOrder = id => setRoute(r => ({ module: 'orders', view: 'detail', id, tab: null, from: r.module === 'subscriptions' && r.view === 'detail' ? r : null }));
  const goTab = tab => setRoute(r => ({ ...r, tab }));
  const goModule = m => setRoute({ module: m, view: 'list' });
  const switchActor = k => {
    setActorKey(k); setModal(null);
    if (curSub && !canSee(k, curSub)) { setRoute({ module: 'subscriptions', view: 'list' }); notify(`${ACTORS[k].account} can't see ${curSub.id}, so you're back on the list.`, 'info'); }
    if (curOrder && !canSeeOrder(k, curOrder)) { setRoute({ module: 'orders', view: 'list' }); notify(`${ACTORS[k].account} can't see ${curOrder.id}, so you're back on the list.`, 'info'); }
  };
  // Completing an order applies it: a purchase creates its subscription, a change updates quantities, a termination ends the subscription.
  const completeOrder = (oid, opts = {}) => {
    const o = orders.find(x => x.id === oid); if (!o) return;
    const newSub = o.type === 'Purchase' && !o.subId ? subFromOrder(o, subs.length) : null;
    updateOrder(oid, x => ({ ...x, status: 'Completed', completion: opts.template || 'complete', subId: newSub ? newSub.id : x.subId, agreement: { ...x.agreement, status: 'Active' }, ids: opts.vendorId !== undefined ? { ...x.ids, vendor: opts.vendorId } : x.ids }), { event: 'Completed', details: newSub ? `Order completed · ${newSub.id} created` : 'Order completed' });
    if (newSub) setSubs(l => [newSub, ...l]);
    else if (o.subId && o.type !== 'Purchase') {
      const qmap = Object.fromEntries(o.items.map(it => [it.id, it.qty]));
      updateSub(o.subId, s => {
        const base = { ...s, agreement: { ...s.agreement, status: 'Active' }, pending: s.pending && s.pending.orderId === oid ? null : s.pending };
        return o.type === 'Change' ? { ...base, status: 'Active', items: s.items.map(it => ({ ...it, qty: qmap[it.id] ?? it.qty })) } : { ...base, status: 'Terminated', autoRenew: false };
      }, { event: o.type === 'Change' ? 'Change order completed' : 'Subscription terminated', details: oid });
    }
    notify(newSub ? `Order ${oid} completed. Subscription ${newSub.id} is now Active.` : o.type === 'Change' ? `Order ${oid} completed. The subscription is Active again with the new quantities.` : o.type === 'Terminate' ? `Order ${oid} completed. The subscription is now Terminated.` : `Order ${oid} completed.`);
  };
  // A failed change or termination leaves the subscription as it was.
  const failOrder = (oid, reason) => {
    const o = orders.find(x => x.id === oid); if (!o) return;
    updateOrder(oid, x => ({ ...x, status: 'Failed', failReason: reason, agreement: { ...x.agreement, status: agreementStatusFor(x.type, 'Failed') } }), { event: 'Failed', details: reason });
    if (o.subId && o.type !== 'Purchase') updateSub(o.subId, s => s.pending && s.pending.orderId === oid ? { ...s, status: 'Active', agreement: { ...s.agreement, status: 'Active' }, pending: null } : s, { event: `${o.type} order failed`, details: `${oid} · ${reason}` });
    notify(`Order ${oid} failed. The reason is visible to the client.`);
  };
  const completePending = () => { if (curSub && curSub.pending) completeOrder(curSub.pending.orderId); };
  const reset = () => { Object.keys(tableCache).forEach(k => delete tableCache[k]); const seed = makeSeed(); setSubs(seed); setOrders(makeOrders(seed)); setRoute(r => ({ module: r.module, view: 'list' })); setModal(null); setQuery(''); notify('Prototype data reset', 'info'); };
  const onQuery = q => { setQuery(q); if (route.view !== 'list' && q) setRoute(r => ({ module: r.module, view: 'list' })); };

  const ctx = { actor, notify, updateSub, openModal, goTab, subs, orders, updateOrder, addOrder, openOrder, openOrderModal, openSub: open, completeOrder, failOrder };
  let page;
  if (curOrder) page = html`<${OrderDetail} key=${curOrder.id + actorKey} o=${curOrder} tab=${route.tab} onTab=${goTab} onBack=${() => setRoute(route.from || { module: 'orders', view: 'list' })} />`;
  else if (curSub) page = html`<${SubscriptionDetail} key=${curSub.id + actorKey} sub=${curSub} tab=${route.tab} onTab=${goTab} onBack=${() => setRoute({ module: 'subscriptions', view: 'list' })} />`;
  else if (route.module === 'orders') page = html`<${TopNav} actor=${actor} module="orders" onModule=${goModule} /><${OrderList} orders=${orders.filter(o => canSeeOrder(actorKey, o))} query=${query} onOpen=${openOrder} />`;
  else page = html`<${TopNav} actor=${actor} module="subscriptions" onModule=${goModule} /><${SubscriptionList} subs=${subs.filter(s => canSee(actorKey, s))} query=${query} onOpen=${open} />`;
  return html`<${Ctx.Provider} value=${ctx}>
    <${ProtoBar} actorKey=${actorKey} onActor=${switchActor} pendingSub=${curSub && curSub.pending ? curSub : null} onComplete=${completePending} onReset=${reset} />
    <${Header} actor=${actor} query=${query} onQuery=${onQuery} onActor=${switchActor} />
    ${page}
    <${ModalHost} modal=${modal} subs=${subs} close=${() => setModal(null)} />
    <${OrderModalHost} modal=${modal} orders=${orders} close=${() => setModal(null)} />
    <${Toasts} toasts=${toasts} dismiss=${id => setToasts(t => t.filter(x => x.id !== id))} />
  <//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
</script>
</body>
</html>
