<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Subscriptions for iPhone</title>
<meta name="description" content="iPhone prototype of the Marketplace Subscriptions module for the Client, Vendor and Operations actors, built with Apple’s iOS components.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<style>
/* ===== iOS 27 tokens (from the "iOS and iPadOS 27" Figma kit: system colours, Liquid Glass layers, type ramp) ===== */
:root{
  --tint:#0088ff; --red:#ff383c; --green:#34c759; --orange:#ff8d28; --indigo:#6155f5; --purple:#cb30e0; --teal:#00c3d0; --gray:#8e8e93;
  --ink-green:#248a3d; --ink-red:#d70015; --ink-blue:#0068d6; --ink-orange:#c93400; --ink-gray:#636366;
  --label:#000000; --label-2:rgba(60,60,67,.6); --label-3:rgba(60,60,67,.3); --sep:rgba(60,60,67,.2);
  --bg:#f2f2f7; --cell:#ffffff; --fill:rgba(118,118,128,.12); --fill-2:rgba(120,120,128,.16); --press:rgba(0,0,0,.06);
  --seg-knob:#ffffff;
  /* Liquid Glass — Regular (controls) and Medium/Large (sheets, menus, alerts) */
  --glass:rgba(255,255,255,.6); --glass-sel:rgba(0,0,0,.07);
  --glass-sheet:rgba(242,242,247,.82);
  --glass-rim:inset 0 1px 1px rgba(255,255,255,.95),inset 0 -1px 1px rgba(0,0,0,.04),inset 1.25px 0 1px rgba(255,255,255,.55),inset -1.25px 0 1px rgba(255,255,255,.55);
  --glass-shadow:0 8px 15px rgba(0,0,0,.04),0 1px 4px rgba(0,0,0,.08);
  --glass-shadow-lg:0 8px 48px rgba(0,0,0,.22),0 0 0 .5px rgba(0,0,0,.04);
  --dim:rgba(0,0,0,.2);
  --stage:#dedfe5; --stage-card:rgba(255,255,255,.7); --stage-ink:#1d1d1f; --stage-ink-2:#6e6e73;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",system-ui,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-rounded:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,"Helvetica Neue",Arial,sans-serif;
  --safe-top:62px; --safe-bottom:34px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --tint:#0091ff; --red:#ff4245; --green:#30d158; --orange:#ff9230; --indigo:#6d7cff; --purple:#db34f2; --teal:#00d2e0;
    --ink-green:#30d158; --ink-red:#ff6961; --ink-blue:#409cff; --ink-orange:#ffb340; --ink-gray:#aeaeb2;
    --label:#ffffff; --label-2:rgba(235,235,245,.6); --label-3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6);
    --bg:#000000; --cell:#1c1c1e; --fill:rgba(118,118,128,.24); --fill-2:rgba(120,120,128,.32); --press:rgba(255,255,255,.08);
    --seg-knob:#636366;
    --glass:rgba(44,44,48,.58); --glass-sel:rgba(255,255,255,.12); --glass-sheet:rgba(28,28,30,.84);
    --glass-rim:inset 0 1px 1px rgba(255,255,255,.2),inset 0 -1px 1px rgba(0,0,0,.35),inset 1.25px 0 1px rgba(255,255,255,.08),inset -1.25px 0 1px rgba(255,255,255,.08);
    --glass-shadow:0 8px 15px rgba(0,0,0,.25),0 1px 4px rgba(0,0,0,.4);
    --glass-shadow-lg:0 8px 48px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.08);
    --dim:rgba(0,0,0,.45);
    --stage:#141416; --stage-card:rgba(44,44,46,.7); --stage-ink:#f5f5f7; --stage-ink-2:#98989d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --tint:#0091ff; --red:#ff4245; --green:#30d158; --orange:#ff9230; --indigo:#6d7cff; --purple:#db34f2; --teal:#00d2e0;
  --ink-green:#30d158; --ink-red:#ff6961; --ink-blue:#409cff; --ink-orange:#ffb340; --ink-gray:#aeaeb2;
  --label:#ffffff; --label-2:rgba(235,235,245,.6); --label-3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6);
  --bg:#000000; --cell:#1c1c1e; --fill:rgba(118,118,128,.24); --fill-2:rgba(120,120,128,.32); --press:rgba(255,255,255,.08);
  --seg-knob:#636366;
  --glass:rgba(44,44,48,.58); --glass-sel:rgba(255,255,255,.12); --glass-sheet:rgba(28,28,30,.84);
  --glass-rim:inset 0 1px 1px rgba(255,255,255,.2),inset 0 -1px 1px rgba(0,0,0,.35),inset 1.25px 0 1px rgba(255,255,255,.08),inset -1.25px 0 1px rgba(255,255,255,.08);
  --glass-shadow:0 8px 15px rgba(0,0,0,.25),0 1px 4px rgba(0,0,0,.4);
  --glass-shadow-lg:0 8px 48px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.08);
  --dim:rgba(0,0,0,.45);
  --stage:#141416; --stage-card:rgba(44,44,46,.7); --stage-ink:#f5f5f7; --stage-ink-2:#98989d;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--label);font:400 17px/22px var(--font);letter-spacing:-.43px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
button{-webkit-user-select:none;user-select:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sym{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-feature-settings:'liga';flex:none;overflow:hidden}
:focus-visible{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--tint) 50%,transparent)!important}
.num{font-variant-numeric:tabular-nums}

/* ===== Stage + device (desktop viewing only) ===== */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding:24px;background:var(--stage);color:var(--stage-ink)}
.panel{width:300px;display:flex;flex-direction:column;gap:22px;flex:none}
.panel .tag{align-self:flex-start;font:600 11px/16px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--stage-ink-2);border:1px solid currentColor;border-radius:6px;padding:1px 6px}
.panel h1{margin:0;font:700 28px/34px var(--font);letter-spacing:.36px;text-wrap:balance}
.panel .lede{margin:6px 0 0;color:var(--stage-ink-2);font:400 15px/20px var(--font);letter-spacing:-.23px}
.panel .ctl{display:flex;flex-direction:column;gap:8px}
.panel .ctl-label{font:600 13px/18px var(--font);letter-spacing:-.08px;color:var(--stage-ink-2)}
.panel .note{font:400 13px/18px var(--font);letter-spacing:-.08px;color:var(--stage-ink-2);background:var(--stage-card);border-radius:16px;padding:12px 14px}
.panel .note b{color:var(--stage-ink);font-weight:600}
.panel .linkish{align-self:flex-start;border:0;background:none;color:var(--tint);padding:0;cursor:pointer;font:400 15px/20px var(--font)}
.device-box{flex:none;position:relative}
.device{position:absolute;left:0;top:0;width:426px;height:898px;padding:12px;border-radius:68px;background:#1c1c1e;box-shadow:inset 0 0 0 1.5px #4a4a4d,inset 0 0 0 5px #0d0d0e,0 40px 90px rgba(0,0,0,.28),0 6px 20px rgba(0,0,0,.18);transform-origin:top left}
.screen{position:relative;width:402px;height:874px;border-radius:56px;overflow:hidden;background:var(--bg);isolation:isolate}
.statusbar{position:absolute;left:0;right:0;top:0;height:62px;padding:21px 30px 0 52px;display:flex;justify-content:space-between;z-index:40;pointer-events:none;color:var(--label);font:600 17px/22px var(--font);letter-spacing:-.4px}
.statusbar .lv{display:flex;gap:7px;align-items:center;height:22px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:125px;height:37px;border-radius:20px;background:#000;z-index:41}
.home-ind{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:139px;height:5px;border-radius:3px;background:var(--label);z-index:41;pointer-events:none}
@media (max-width: 980px){ .stage{flex-direction:column;justify-content:flex-start;gap:24px} .panel{width:min(426px,100%)} }
@media (max-width: 520px){
  :root{--safe-top:max(env(safe-area-inset-top,0px),12px);--safe-bottom:max(env(safe-area-inset-bottom,0px),12px)}
  body{background:var(--bg)}
  .stage{display:block;padding:0}
  .panel,.statusbar,.island,.home-ind{display:none}
  .device-box{width:100%!important;height:100dvh!important}
  .device{position:static;width:100%;height:100%;padding:0;border-radius:0;box-shadow:none;background:none;transform:none!important}
  .screen{width:100%;height:100%;border-radius:0}
}

/* ===== Liquid Glass ===== */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(12px) saturate(190%);backdrop-filter:blur(12px) saturate(190%);box-shadow:var(--glass-rim),var(--glass-shadow)}
.glass-sheet{background:var(--glass-sheet);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:var(--glass-rim),var(--glass-shadow-lg)}
.gbtn{height:44px;min-width:44px;border-radius:22px;border:0;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 16px;font:500 17px/22px var(--font);letter-spacing:-.43px;color:var(--label);cursor:pointer;flex:none;transition:transform .22s cubic-bezier(.3,.7,.4,1.5),opacity .2s;white-space:nowrap}
.gbtn.icon{width:44px;padding:0}
.gbtn:active:not(:disabled){transform:scale(1.08)}
.gbtn.prominent{background:var(--tint);color:#fff;box-shadow:inset 0 1px 1px rgba(255,255,255,.4),inset 0 -1px 1px rgba(0,0,0,.1),0 6px 16px color-mix(in srgb,var(--tint) 30%,transparent)}
.gbtn.prominent.destructive{background:var(--red);box-shadow:inset 0 1px 1px rgba(255,255,255,.4),inset 0 -1px 1px rgba(0,0,0,.1),0 6px 16px color-mix(in srgb,var(--red) 28%,transparent)}
.gbtn.tinted{color:var(--tint);font-weight:600}
.gbtn:disabled{opacity:.35;cursor:default}
.gbtn.big{width:100%;height:52px;border-radius:26px;font-weight:600}
.ggroup{display:inline-flex;align-items:center;height:44px;border-radius:22px;padding:0 2px;flex:none}
.ggroup .gbtn{background:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;width:40px;min-width:40px}
.acct-dot{width:28px;height:28px;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 0 .5px var(--sep)}
.acct-dot img{width:72%;height:72%;object-fit:contain}

/* ===== Screen chrome ===== */
.page{position:absolute;inset:0;background:var(--bg)}
.page.push{animation:pushIn .46s cubic-bezier(.32,.72,0,1)}
.page.pop{animation:popIn .4s cubic-bezier(.32,.72,0,1)}
@keyframes pushIn{from{transform:translateX(100%);box-shadow:-20px 0 40px rgba(0,0,0,.12)}to{transform:none}}
@keyframes popIn{from{transform:translateX(-28%);opacity:.7}to{transform:none;opacity:1}}
.scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:calc(var(--safe-top) + 54px) 0 calc(var(--safe-bottom) + 112px);scrollbar-width:none;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.scroller::-webkit-scrollbar{display:none}
.toolbar{position:absolute;left:0;right:0;top:var(--safe-top);height:54px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 16px 6px;z-index:20;pointer-events:none}
.tb-side{display:flex;align-items:center;gap:8px;pointer-events:auto;flex:none;min-width:44px}
.tb-side.right{justify-content:flex-end}
.inline-title{position:absolute;left:140px;right:140px;top:11px;text-align:center;font:600 17px/22px var(--font);letter-spacing:-.43px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s;pointer-events:none}
.toolbar.show-title .inline-title{opacity:1}
.edge-top{position:absolute;left:0;right:0;top:0;height:calc(var(--safe-top) + 66px);z-index:15;pointer-events:none;opacity:0;transition:opacity .25s;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);background:linear-gradient(to bottom,color-mix(in srgb,var(--bg) 80%,transparent) 0%,color-mix(in srgb,var(--bg) 40%,transparent) 70%,transparent);-webkit-mask-image:linear-gradient(to bottom,#000 60%,transparent);mask-image:linear-gradient(to bottom,#000 60%,transparent)}
.edge-top.on{opacity:1}
.edge-bottom{position:absolute;left:0;right:0;bottom:0;height:calc(var(--safe-bottom) + 96px);z-index:15;pointer-events:none;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);background:linear-gradient(to top,color-mix(in srgb,var(--bg) 60%,transparent),transparent);-webkit-mask-image:linear-gradient(to top,#000 45%,transparent);mask-image:linear-gradient(to top,#000 45%,transparent)}

/* Type ramp */
.large-title{margin:0;padding:2px 16px 14px;font:700 34px/41px var(--font);letter-spacing:.4px}
.title2{font:700 22px/28px var(--font);letter-spacing:-.26px}
.footnote{font:400 13px/18px var(--font);letter-spacing:-.08px;color:var(--label-2)}

/* ===== Lists (Row / Header / Grouped table) ===== */
.section{margin:0 16px 28px}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:0 16px 8px;font:600 17px/22px var(--font);color:var(--label-2)}
.section-h .act{border:0;background:none;color:var(--tint);font:400 17px/22px var(--font);padding:0;cursor:pointer}
.group{background:var(--cell);border-radius:26px;overflow:hidden}
.glass-sheet .group{background:var(--cell)}
.section-f{padding:8px 16px 0;font:400 13px/18px var(--font);letter-spacing:-.08px;color:var(--label-2)}
.section-f.error{color:var(--red)}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 0 0 16px;background:transparent;border:0;text-align:left;color:var(--label);position:relative;font:400 17px/22px var(--font);letter-spacing:-.43px}
button.row{cursor:pointer}
button.row:active{background:var(--press)}
.row-body{flex:1;min-width:0;align-self:stretch;display:flex;align-items:center;gap:10px;padding:11px 16px 11px 0;box-shadow:inset 0 -.5px 0 var(--sep)}
.row:last-child>.row-body{box-shadow:none}
.row.tall .row-body{padding-top:12px;padding-bottom:12px}
.row-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-title.wrap{white-space:normal}
.row-title.strong{font-weight:600}
.row-cap{font:400 13px/18px var(--font);letter-spacing:-.08px;color:var(--label-2)}
.row-sub{display:flex;align-items:center;gap:6px;min-width:0;font:400 15px/20px var(--font);letter-spacing:-.23px;color:var(--label-2)}
.row-sub>span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row-detail{color:var(--label-2);text-align:right;flex:0 1 auto;max-width:58%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-detail.tint{color:var(--tint)}
.row-amt{display:flex;flex-direction:column;align-items:flex-end;flex:none;text-align:right}
.row-amt .v{font:500 16px/21px var(--font);letter-spacing:-.31px;font-variant-numeric:tabular-nums}
.row-amt .u{font:400 12px/16px var(--font);color:var(--label-2)}
.chev{color:var(--label-3)}
.check{color:var(--tint)}
.row.center .row-body{justify-content:center}
.row-action{color:var(--tint)}
.row-action.destructive{color:var(--red)}
.tile{flex:none;display:inline-flex;align-items:center;justify-content:center;background:#fff;box-shadow:0 0 0 .5px var(--sep);overflow:hidden}
.tile img{width:68%;height:68%;object-fit:contain}
.flag{flex:none;border-radius:50%;overflow:hidden;display:inline-flex}
.flag img{width:100%;height:100%}
.itile{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:#fff;flex:none}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(180deg,#a5a5ac,#86868d);color:#fff;font:600 13px/1 var(--font-rounded);display:inline-flex;align-items:center;justify-content:center;flex:none;align-self:flex-start;margin-top:12px}
.cap{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;font:600 13px/18px var(--font);letter-spacing:-.08px;flex:none;white-space:nowrap}
.cap.green{color:var(--ink-green);background:color-mix(in srgb,var(--green) 16%,transparent)}
.cap.blue{color:var(--ink-blue);background:color-mix(in srgb,var(--tint) 14%,transparent)}
.cap.red{color:var(--ink-red);background:color-mix(in srgb,var(--red) 14%,transparent)}
.cap.orange{color:var(--ink-orange);background:color-mix(in srgb,var(--orange) 16%,transparent)}
.cap.gray{color:var(--ink-gray);background:var(--fill)}
.pos{color:var(--ink-green)} .neg{color:var(--ink-red)}

/* Segmented control */
.seg{position:relative;display:flex;background:var(--fill);border-radius:100px;padding:2px;height:40px}
.seg button{flex:1;min-width:0;border:0;background:transparent;border-radius:100px;font:500 13.33px/18px var(--font);letter-spacing:-.08px;position:relative;z-index:1;cursor:pointer;color:var(--label);padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button[aria-checked="true"]{font-weight:600}
.seg .knob{position:absolute;top:2px;bottom:2px;border-radius:100px;background:var(--seg-knob);box-shadow:0 2px 20px rgba(0,0,0,.06),0 0 0 .5px rgba(0,0,0,.04),0 3px 8px rgba(0,0,0,.08);transition:left .32s cubic-bezier(.3,.7,.3,1),width .32s cubic-bezier(.3,.7,.3,1)}
.seg-wrap{padding:0 16px 20px}

/* Controls */
.stepper{display:inline-flex;align-items:center;height:32px;border-radius:16px;background:var(--fill);flex:none}
.stepper button{width:44px;height:32px;border:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--label);border-radius:16px}
.stepper button:active:not(:disabled){background:var(--press)}
.stepper button:disabled{color:var(--label-3);cursor:default}
.stepper .div{width:1px;height:18px;background:var(--sep)}
.qty{width:56px;border:0;background:none;text-align:right;font:600 17px/22px var(--font);color:var(--label);padding:0;outline:none}
.qty.changed{color:var(--tint)}
.qty.bad{color:var(--red)}
.switch{width:64px;height:28px;border-radius:14px;background:var(--fill-2);position:relative;border:0;cursor:pointer;flex:none;transition:background-color .25s;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:39px;height:24px;border-radius:12px;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.06);transition:left .28s cubic-bezier(.3,.7,.3,1.25)}
.switch[aria-checked="true"]{background:var(--green)}
.switch[aria-checked="true"]::after{left:23px}
.field{flex:1;min-width:0;border:0;background:none;outline:none;text-align:right;color:var(--label);font:400 17px/22px var(--font);letter-spacing:-.43px;padding:0}
.field.left{text-align:left}
.field::placeholder{color:var(--label-3)}
.field:disabled{color:var(--label-2);-webkit-text-fill-color:var(--label-2)}
.field.error{color:var(--red)}
.unit{color:var(--label-2);flex:none}
textarea.field{resize:none;min-height:66px;text-align:left;display:block;width:100%}
.searchbox{display:flex;align-items:center;gap:6px;height:40px;border-radius:20px;background:var(--fill);padding:0 12px;margin:0 16px 22px;color:var(--label-2)}
.searchbox input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--label);font:400 17px/22px var(--font)}
.searchbox input::placeholder{color:var(--label-2)}
.searchbox .clear{border:0;background:none;padding:0;color:var(--label-3);cursor:pointer;display:inline-flex}

/* Detail */
.hero{display:flex;gap:16px;align-items:center;padding:4px 16px 20px}
.hero h1{margin:0}
.hero .id{font:400 15px/20px var(--font);letter-spacing:-.23px;color:var(--label-2);-webkit-user-select:text;user-select:text}
.hero .meta{display:flex;flex-direction:column;gap:4px;min-width:0}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 16px 28px}
.metric{background:var(--cell);border-radius:22px;padding:12px 14px;min-width:0}
.metric .k{font:400 13px/18px var(--font);letter-spacing:-.08px;color:var(--label-2)}
.metric .v{font:600 20px/25px var(--font-rounded);letter-spacing:-.45px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.metric .u{font:400 12px/16px var(--font);color:var(--label-2);white-space:nowrap}
.banner{margin:0 16px 28px;border-radius:22px;padding:14px 16px;background:color-mix(in srgb,var(--tint) 12%,var(--cell));display:flex;gap:12px;align-items:flex-start}
.banner .sym{color:var(--tint);margin-top:1px}
.banner b{font-weight:600}

const Ctx = createContext(null);
const useApp = () => useContext(Ctx);

/* ---------- Primitives ---------- */
// Material Symbols Rounded stands in for SF Symbols, which Apple doesn't license for the web.
function Sym({ n, size = 20, w = 500, fill = 0, className, style }) {
  return html`<span className=${cx('sym', className)} aria-hidden="true" style=${{ fontSize: size, width: size, height: size, fontVariationSettings: `'FILL' ${fill}, 'wght' ${w}, 'GRAD' 0, 'opsz' ${Math.max(20, Math.min(48, size))}`, ...style }}>${n}</span>`;
}
function BrandMark({ width = 80 }) {
  const h = width * 0.35294;
  return html`<span style=${{ position: 'relative', display: 'inline-block', width, height: h }} role="img" aria-label="SoftwareOne">
    <img src=${ASSET.one} alt="" style=${{ width, height: h, display: 'block' }} />
    <img src=${ASSET.software} alt="" style=${{ position: 'absolute', left: width * 0.013625, top: width * 0.132625, width: width * 0.323075, height: width * 0.0643875 }} />
  </span>`;
}
function Tile({ k, size = 40 }) {
  return html`<span className="tile" style=${{ width: size, height: size, borderRadius: Math.round(size * 0.25) }}>${k === 'swo' ? html`<${BrandMark} width=${size * 0.78} />` : (k && ASSET[k] ? html`<img src=${ASSET[k]} alt="" />` : null)}</span>`;
}
const Flag = ({ k, size = 28 }) => html`<span className="flag" style=${{ width: size, height: size }}><img src=${ASSET[k]} alt="" /></span>`;
const ITile = ({ icon, color }) => html`<span className="itile" style=${{ background: color }}><${Sym} n=${icon} size=${19} w=${500} fill=${1} /></span>`;
const TONE = { Active: 'green', Completed: 'green', Updating: 'blue', Processing: 'blue', Owner: 'blue', Draft: 'gray', New: 'gray', Terminating: 'red', Terminated: 'red', Expired: 'red' };
const Cap = ({ children, tone }) => html`<span className=${'cap ' + (tone || TONE[children] || 'gray')}>${children}</span>`;
function GButton({ icon, label, onClick, prominent, destructive, tinted, disabled, ariaLabel, big, btnRef, iconSize = 20, busy, type = 'button' }) {
  return html`<button ref=${btnRef} type=${type} className=${cx('gbtn', !prominent && 'glass', prominent && 'prominent', destructive && 'destructive', tinted && 'tinted', icon && !label && 'icon', big && 'big')} disabled=${disabled || busy} aria-label=${ariaLabel} aria-busy=${busy ? 'true' : undefined} onClick=${onClick}>
    ${busy ? html`<span className="spin" aria-hidden="true"></span>` : html`${icon ? html`<${Sym} n=${icon} size=${iconSize} w=${prominent ? 600 : 500} />` : null}${label ? html`<span>${label}</span>` : null}`}
  </button>`;
}
function Segmented({ options, value, onChange, label }) {
  const i = Math.max(0, options.findIndex(o => o[0] === value));
  const w = 100 / options.length;
  const onKey = e => { if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return; const n = (i + (e.key === 'ArrowRight' ? 1 : -1) + options.length) % options.length; onChange(options[n][0]); e.preventDefault(); };
  return html`<div className="seg" role="radiogroup" aria-label=${label} onKeyDown=${onKey}>
    <span className="knob" style=${{ left: `calc(${i * w}% + 2px)`, width: `calc(${w}% - 4px)` }}></span>
    ${options.map(([k, l]) => html`<button key=${k} type="button" role="radio" aria-checked=${k === value ? 'true' : 'false'} tabIndex=${k === value ? 0 : -1} onClick=${() => onChange(k)}>${l}</button>`)}
  </div>`;
}
const Switch = ({ on, onChange, label }) => html`<button type="button" className="switch" role="switch" aria-checked=${on ? 'true' : 'false'} aria-label=${label} onClick=${() => onChange(!on)}></button>`;
function Section({ header, action, footer, error, children }) {
  return html`<section className="section">
    ${header ? html`<div className="section-h"><span>${header}</span>${action || null}</div>` : null}
    <div className="group">${children}</div>
    ${footer ? html`<div className=${cx('section-f', error && 'error')} role=${error ? 'alert' : undefined}>${footer}</div>` : null}
  </section>`;
}
// Row: leading accessory sits outside the body so the separator is inset to the text, as in the kit.
function Row({ leading, title, cap, sub, subNode, detail, detailTint, trailing, chevron, onClick, tall, wrap, strong, check, center, action, destructive, disabled, label }) {
  const body = html`${leading || null}<span className="row-body">
      <span className="row-text">
        ${cap ? html`<span className="row-cap">${cap}</span>` : null}
        <span className=${cx('row-title', wrap && 'wrap', strong && 'strong', action && 'row-action', destructive && 'destructive')}>${title}</span>
        ${subNode || (sub ? html`<span className="row-sub"><span className="t">${sub}</span></span>` : null)}
      </span>
      ${detail != null ? html`<span className=${cx('row-detail', detailTint && 'tint')}>${detail}</span>` : null}
      ${trailing || null}
      ${check ? html`<${Sym} n="check" size=${20} w=${600} className="check" />` : null}
      ${chevron ? html`<${Sym} n="chevron_right" size=${20} w=${600} className="chev" />` : null}
    </span>`;
  const cls = cx('row', tall && 'tall', center && 'center');
  return onClick ? html`<button type="button" className=${cls} onClick=${onClick} disabled=${disabled} aria-label=${label}>${body}</button>` : html`<div className=${cls}>${body}</div>`;
}
const Unavailable = ({ icon, title, text, action }) => html`<div className="unavail"><${Sym} n=${icon} size=${56} w=${300} /><h2 className="title2">${title}</h2><div>${text}</div>${action || null}</div>`;

/* ---------- Page (scroll container + floating glass toolbar) ---------- */
const scrollMemo = {};
function Page({ pid, anim, title, inlineAt = 0, left, right, children }) {
  const { reportScroll } = useApp();
  const ref = useRef(null); const last = useRef(0);
  const [phase, setPhase] = useState(0);
  useLayoutEffect(() => { const el = ref.current; if (el && scrollMemo[pid]) el.scrollTop = scrollMemo[pid]; onScroll(); }, []);
  function onScroll() {
    const el = ref.current; if (!el) return;
    const t = el.scrollTop; scrollMemo[pid] = t;
    const p = t > Math.max(inlineAt, 6) ? 2 : t > 6 ? 1 : 0;
    setPhase(x => x === p ? x : p);
    const d = t - last.current;
    if (Math.abs(d) > 8) { reportScroll(d > 0 && t > 80 ? 'down' : 'up'); last.current = t; }
  }
  const showTitle = inlineAt === 0 || phase === 2;
  return html`<section className=${cx('page', anim)} aria-label=${title}>
    <div className="scroller" ref=${ref} onScroll=${onScroll}>${children}</div>
    <div className=${cx('edge-top', phase > 0 && 'on')}></div>
    <div className=${cx('toolbar', showTitle && 'show-title')}>
      <div className="tb-side">${left || null}</div>
      ${title ? html`<div className="inline-title" aria-hidden=${showTitle ? undefined : 'true'}>${title}</div>` : null}
      <div className="tb-side right">${right || null}</div>
    </div>
  </section>`;
}
const BackButton = ({ onClick }) => html`<${GButton} icon="arrow_back_ios_new" iconSize=${19} ariaLabel="Back" onClick=${onClick} />`;

/* ---------- Subscriptions list ---------- */
const listUI = {};
const SEGMENTS = [['all', 'All'], ['active', 'Active'], ['attention', 'Attention'], ['ended', 'Ended']];
const ATTENTION = ['Updating', 'Terminating', 'Expired'];
const whoFor = (actorKey, s) => actorKey === 'client' ? s.licensee.name : s.client.name;
function SubRow({ s, basis, onOpen }) {
  const { actor } = useApp();
  const t = totals(s.items, basis); const ended = s.status === 'Terminated';
  const when = ended || s.status === 'Expired' ? `Ended ${s.renewal}` : `Renews ${s.renewal}`;
  return html`<${Row} tall onClick=${() => onOpen(s.id)}

      <button ref=${acctRef} type="button" className="gbtn icon" aria-label=${`Account: ${actor.account}`} onClick=${() => openSheet('account')}><span className="acct-dot">${actor.logo === 'swo' ? html`<${BrandMark} width=${22} />` : html`<img src=${ASSET[actor.logo]} alt="" />`}</span></button>

      : html`<${Unavailable} icon="inbox" title="No subscriptions" text="Nothing matches this filter." action=${html`<${GButton} label="Show all" onClick=${() => set({ seg: 'all', billing: [] })} />`} />`}
    ${rows.length ? html`<p className="footnote" style=${{ margin: '-14px 32px 0' }}>${money(monthly)} ${'GBP'} per month across ${rows.filter(s => s.status !== 'Terminated').length} live subscriptions (${basis}x). Estimated; actual amounts appear on the next bill.</p>` : null}

  if (actor.key === 'client') return [{ items: [
    { label: 'Rename', icon: 'edit', disabled: !live, onClick: () => openSheet('rename', s.id) },
    { label: 'Edit ID', icon: 'tag', disabled: !live, onClick: () => openSheet('ids', s.id) },
    { label: 'Billing Currency', icon: 'currency_exchange', disabled: !active, onClick: () => openSheet('currency', s.id) },
    { label: 'Split Billing', icon: 'call_split', disabled: !active, onClick: () => openSheet('split', s.id) }] }, { items: [terminate] }];
  if (actor.key === 'vendor') return [{ items: [
    { label: 'Edit ID', icon: 'tag', disabled: !live, onClick: () => openSheet('ids', s.id) },
    { label: 'Fulfillment Parameters', icon: 'tune', disabled: !live, onClick: () => openSheet('params', s.id) }] }, { items: [terminate] }];

}

    ${pend ? html`<div className="banner" role="status">

        <div className="acts"><button type="button" onClick=${() => go('orders')}>View Order</button><button type="button" onClick=${() => completePending(s.id)}>Simulate completion</button></div>

    <${Section} header="Overview">

function OverlayHost({ overlay, close }) {
  const { subs } = useApp();
  useEffect(() => { if (!overlay) return; const k = e => { if (e.key === 'Escape') close(); }; document.addEventListener('keydown', k); return () => document.removeEventListener('keydown', k); }, [overlay]);
  if (!overlay) return null;
  if (overlay.kind === 'menu') return html`<${Menu} rect=${overlay.rect} groups=${overlay.groups} close=${close} />`;
  if (overlay.kind === 'sheet' && overlay.type === 'account') return html`<${AccountSheet} close=${close} />`;
  const s = subs.find(x => x.id === overlay.subId); if (!s) return null;
  if (overlay.kind === 'alert') return html`<${TerminateAlert} s=${s} close=${close} />`;
  const p = { s, close };
  switch (overlay.type) {
    case 'rename': return html`<${RenameSheet} ...${p} />`;
    case 'ids': return html`<${IdsSheet} ...${p} />`;
    case 'currency': return html`<${CurrencySheet} ...${p} />`;
    case 'price': return html`<${PriceSheet} ...${p} itemId=${overlay.itemId} />`;
    case 'yield': return html`<${YieldSheet} ...${p} />`;
    case 'params': return html`<${ParamsSheet} ...${p} />`;
    case 'split': return html`<${SplitSheet} ...${p} />`;
    case 'change': return html`<${OrderSheet} ...${p} mode="change" />`;
    case 'terminate': return html`<${OrderSheet} ...${p} mode="terminate" />`;
    default: return null;
  }
}

/* ---------- Chrome: status bar, tab bar, stage ---------- */
function StatusBar() {
  return html`<div className="statusbar" aria-hidden="true"><span>9:41</span><span className="lv">
    <svg width="19" height="12" viewBox="0 0 19 12" fill="currentColor"><rect x="0" y="7.5" width="3.2" height="4.5" rx="1"/><rect x="5" y="5" width="3.2" height="7" rx="1"/><rect x="10" y="2.5" width="3.2" height="9.5" rx="1"/><rect x="15" y="0" width="3.2" height="12" rx="1"/></svg>
    <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2.6c2.4 0 4.6.9 6.2 2.5l1.2-1.2A10.4 10.4 0 0 0 8.5.9 10.4 10.4 0 0 0 1.1 3.9l1.2 1.2a8.7 8.7 0 0 1 6.2-2.5Zm0 3.4c1.5 0 2.8.6 3.8 1.5l1.2-1.2a7 7 0 0 0-5-2 7 7 0 0 0-5 2l1.2 1.2c1-.9 2.3-1.5 3.8-1.5Zm0 3.4c.6 0 1.1.2 1.5.6L8.5 11.5 7 10a2.1 2.1 0 0 1 1.5-.6Z"/></svg>
    <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x=".5" y=".5" width="23" height="12" rx="3.8" stroke="currentColor" opacity=".35"/><rect x="2" y="2" width="20" height="9" rx="2.5" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" fill="currentColor" opacity=".4"/></svg>
  </span></div>`;
}
const TABS = [['subs', 'Subscriptions', 'autorenew'], ['orders', 'Orders', 'receipt_long'], ['agreements', 'Agreements', 'handshake']];
function TabBar({ tab, onTab, min }) {
  return html`<nav className=${cx('tabbar', min && 'min')} aria-label="Tabs">
    <div className="tabs glass" role="tablist">
      ${TABS.map(([k, label, icon]) => html`<button key=${k} type="button" role="tab" className="tab" aria-selected=${tab === k ? 'true' : 'false'} aria-label=${label} onClick=${() => onTab(k)}><${Sym} n=${icon} size=${26} w=${tab === k ? 600 : 500} fill=${tab === k ? 1 : 0} /><span className="lbl">${label}</span></button>`)}
    </div>
    <button type="button" role="tab" className="tab-search glass" aria-selected=${tab === 'search' ? 'true' : 'false'} aria-label="Search" onClick=${() => onTab('search')}><${Sym} n="search" size=${26} w=${tab === 'search' ? 650 : 500} /></button>
  </nav>`;
}
function Stage({ children, panel }) {
  const [scale, setScale] = useState(1);
  useLayoutEffect(() => {
    const fit = () => setScale(window.innerWidth <= 520 ? 1 : Math.min(1, (window.innerHeight - 48) / 898, (window.innerWidth - 32) / 426));
    fit(); window.addEventListener('resize', fit); return () => window.removeEventListener('resize', fit);
  }, []);
  return html`<div className="stage">
    ${panel}
    <div className="device-box" style=${{ width: 426 * scale, height: 898 * scale }}>
      <div className="device" style=${{ transform: `scale(${scale})` }}>
        <div className="screen" id="screen">
          ${children}
          <${StatusBar} />
          <div className="island" aria-hidden="true"></div>
          <div className="home-ind" aria-hidden="true"></div>
        </div>
      </div>
    </div>
  </div>`;
}
function Panel({ actorKey, onActor, theme, setTheme, onReset }) {
  return html`<aside className="panel" aria-label="Prototype controls">
    <span className="tag">Prototype</span>
    <div><h1>Subscriptions for iPhone</h1><p className="lede">The Marketplace Subscriptions module for iPhone, built with Apple’s iOS components.</p></div>
    <div className="ctl"><span className="ctl-label">View as</span><${Segmented} label="View as" options=${Object.values(ACTORS).map(a => [a.key, a.label])} value=${actorKey} onChange=${onActor} /></div>
    <div className="ctl"><span className="ctl-label">Appearance</span><${Segmented} label="Appearance" options=${[['light', 'Light'], ['dark', 'Dark'], ['auto', 'Auto']]} value=${theme} onChange=${setTheme} /></div>
    <div className="note"><b>Try it:</b> open a subscription, then use <b>Edit</b> for a change order or <b>•••</b> for rename, split billing and terminate. Pending orders can be completed from the banner on the subscription.</div>
    <div className="note">Icons are Material Symbols Rounded standing in for SF Symbols, which can't be used on the web. On iPhone and Mac the text uses SF Pro.</div>
    <button type="button" className="linkish" onClick=${onReset}>Reset prototype data</button>
  </aside>`;
}

/* ---------- App ---------- */
const ROOTS = { subs: { v: 'list', k: 'list' }, orders: { v: 'orders', k: 'orders' }, agreements: { v: 'agreements', k: 'agreements' }, search: { v: 'search', k: 'search' } };
const freshStacks = () => Object.fromEntries(Object.entries(ROOTS).map(([k, r]) => [k, [r]]));
function localRect(el) {
  const screen = el.closest('.screen'); const sr = screen.getBoundingClientRect(); const kx = sr.width / screen.offsetWidth; const r = el.getBoundingClientRect();
  return { top: (r.top - sr.top) / kx, bottom: (r.bottom - sr.top) / kx, left: (r.left - sr.left) / kx, right: (sr.right - r.right) / kx, screenH: screen.offsetHeight };
}
function App() {
  const hash = (location.hash || '').replace('#', '');
  const [actorKey, setActorKey] = useState(() => ACTORS[hash] ? hash : (ACTORS[store.get('subs-mobile-actor')] ? store.get('subs-mobile-actor') : 'client'));
  const [theme, setThemeState] = useState(() => ['light', 'dark', 'auto'].includes(store.get('subs-mobile-theme')) ? store.get('subs-mobile-theme') : 'auto');
  const [subs, setSubs] = useState(makeSeed);
  const [tab, setTab] = useState('subs');
  const [stacks, setStacks] = useState(freshStacks);
  const [anim, setAnim] = useState(null);
  const [overlay, setOverlay] = useState(null);
  const [toast, setToast] = useState(null);
  const [tabMin, setTabMin] = useState(false);
  const [recent, setRecent] = useState([]);
  const actor = ACTORS[actorKey];
  useEffect(() => { store.set('subs-mobile-actor', actorKey); }, [actorKey]);
  useEffect(() => { store.set('subs-mobile-theme', theme); if (theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', theme); }, [theme]);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 2600); return () => clearTimeout(t); }, [toast]);
  const visible = subs.filter(s => canSee(actorKey, s));
  const stack = stacks[tab]; const top = stack[stack.length - 1];

  const notify = (text, icon = 'check_circle') => setToast({ text, icon, id: Date.now() });
  const push = route => { setAnim('push'); setTabMin(false); setStacks(st => ({ ...st, [tab]: [...st[tab], { ...route, k: `${route.v}-${route.id || ''}-${route.section || ''}-${Date.now()}` }] })); };
  const pop = () => { setAnim('pop'); setStacks(st => ({ ...st, [tab]: st[tab].length > 1 ? st[tab].slice(0, -1) : st[tab] })); };
  const openSub = id => { setRecent(r => [id, ...r.filter(x => x !== id)].slice(0, 5)); push({ v: 'detail', id }); };
  const onTab = k => { setAnim(null); setTabMin(false); if (k === tab && stacks[k].length > 1) setStacks(st => ({ ...st, [k]: [st[k][0]] })); setTab(k); };
  const updateSub = (id, fn, audit) => setSubs(list => list.map(s => {
    if (s.id !== id) return s;
    const next = fn(s); if (!audit) return next;
    const st = nowStamp();
    return { ...next, audit: [{ ...audit, by: actor.user, byId: actor.userId, date: st.date, time: st.time }, ...next.audit] };
  }));
  const completePending = id => {
    const s0 = subs.find(s => s.id === id); if (!s0 || !s0.pending) return;
    const isChange = s0.pending.type === 'change';
    updateSub(id, s => {
      const st = nowStamp();
      const orders = s.orders.map(o => o.id === s.pending.orderId ? { ...o, status: 'Completed', updated: st.date, updatedTime: st.time } : o);
      if (isChange) return { ...s, items: s.items.map(it => ({ ...it, qty: s.pending.qty[it.id] ?? it.qty })), orders, status: 'Active', agreement: { ...s.agreement, status: 'Active' }, pending: null };
      return { ...s, orders, status: 'Terminated', autoRenew: false, agreement: { ...s.agreement, status: 'Active' }, pending: null };
    }, { event: isChange ? 'Change order completed' : 'Subscription terminated', details: s0.pending.orderId });
    notify(isChange ? 'Order completed · subscription is Active' : 'Order completed · subscription Terminated');
  };
  const switchActor = k => {
    if (k === actorKey) return;
    setActorKey(k); setOverlay(null); setAnim(null); setStacks(freshStacks()); setTab('subs');
    notify(`Viewing as ${ACTORS[k].account}`, 'person');
  };
  const reset = () => { Object.keys(listUI).forEach(k => delete listUI[k]); Object.keys(scrollMemo).forEach(k => delete scrollMemo[k]); setSubs(makeSeed()); setStacks(freshStacks()); setTab('subs'); setRecent([]); setOverlay(null); notify('Prototype data reset', 'restart_alt'); };
  const ctx = {
    actor, subs, visible, recent, theme, setTheme: t => setThemeState(t), reset, switchActor, notify, updateSub, completePending,
    openSheet: (type, subId, extra) => setOverlay({ kind: 'sheet', type, subId, ...(extra || {}) }),
    openAlert: cfg => setOverlay({ kind: 'alert', ...cfg }),
    openMenu: (el, groups) => el && setOverlay({ kind: 'menu', rect: localRect(el), groups }),
    pushOrders: id => push({ v: 'section', id, section: 'orders' }),
    reportScroll: dir => setTabMin(dir === 'down' && tab !== 'search')
  };
  const pageProps = { pid: top.k, anim, key: top.k };
  let screen;
  if (top.v === 'list') screen = html`<${ListScreen} ...${pageProps} onOpen=${openSub} />`;
  else if (top.v === 'search') screen = html`<${SearchScreen} ...${pageProps} onOpen=${openSub} />`;
  else if (top.v === 'detail') screen = html`<${DetailScreen} ...${pageProps} id=${top.id} onBack=${pop} push=${push} />`;
  else if (top.v === 'section') screen = html`<${SectionScreen} ...${pageProps} id=${top.id} section=${top.section} onBack=${pop} />`;
  else {
    const title = top.v === 'orders' ? 'Orders' : 'Agreements';
    screen = html`<${Page} ...${pageProps} title=${title} inlineAt=${44}><h1 className="large-title">${title}</h1>
      <${Unavailable} icon=${top.v === 'orders' ? 'receipt_long' : 'handshake'} title=${`${title} isn't in this prototype`} text=${`Only the Subscriptions module is built. Open a subscription to see its ${top.v === 'orders' ? 'orders' : 'agreement'}.`} action=${html`<${GButton} label="Go to Subscriptions" onClick=${() => onTab('subs')} />`} /><//>`;
  }
  return html`<${Ctx.Provider} value=${ctx}>
    <${Stage} panel=${html`<${Panel} actorKey=${actorKey} onActor=${switchActor} theme=${theme} setTheme=${t => setThemeState(t)} onReset=${reset} />`}>
      ${screen}
      <div className="edge-bottom" aria-hidden="true"></div>
      <${TabBar} tab=${tab} onTab=${onTab} min=${tabMin} />
      <${OverlayHost} overlay=${overlay} close=${() => setOverlay(null)} />
      ${toast ? html`<div key=${toast.id} className="toast glass-sheet" role="status" aria-live="polite"><${Sym} n=${toast.icon} size=${22} fill=${1} />${toast.text}</div>` : null}
    <//>
  <//>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
</script>
</body>
